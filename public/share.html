<style>
  :root { --ink: oklch(19% .003 75); --dim: oklch(54% .005 75); --fill: oklch(19% .003 75 / .06); --spring: cubic-bezier(.34, 1.4, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { touch-action: manipulation; }
  body { background: #fff; color: var(--ink); font: 400 15px/1.45 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; letter-spacing: inherit; -webkit-tap-highlight-color: transparent; }
  .ic { width: 16px; height: 16px; fill: currentColor; flex: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }
  .top { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .logo { height: 18px; width: auto; display: block; color: var(--ink); }
  .chips { display: flex; gap: 6px; }
  .chip { height: 32px; padding: 0 14px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; background: var(--fill); white-space: nowrap; }
  .note { margin: 8px 0 0; color: var(--dim); max-width: 560px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 32px; padding: 24px 0 0; }
  .tile { min-width: 0; aspect-ratio: 1; display: grid; place-items: center; animation: pop .5s var(--spring) both; transition: transform .45s var(--spring); }
  .tile:hover { transform: translateY(-4px) rotate(-1deg); }
  .tile img { width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; user-select: none; pointer-events: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  .empty { min-height: 70dvh; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; }
  .empty .big { font-size: 28px; letter-spacing: -.04em; line-height: 1.1; }
  .empty p { margin: 0; color: var(--dim); max-width: 340px; }
  .loader { width: 40px; height: 40px; position: relative; margin: 0 auto 6px; }
  .loader i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--ink); opacity: .18;
    transform: rotate(calc(var(--k) * 45deg - 90deg)) translateX(14px); animation: dot 1.2s linear infinite; animation-delay: calc(var(--k) * .15s - 1.2s); }
  @keyframes dot { 0% { opacity: 1; } 45%, 100% { opacity: .18; } }
  .lb { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: 1fr auto; gap: 20px; padding: 32px 24px max(24px, env(safe-area-inset-bottom)); background: #fff; animation: fade .25s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .lb .stage { min-height: 0; display: grid; place-items: center; }
  .lb .stage img { max-width: min(100%, 760px); max-height: 100%; object-fit: contain; -webkit-user-drag: none; user-select: none; pointer-events: none; animation: pop .45s var(--spring); }
  .lb .bar { justify-self: center; display: flex; gap: 8px; }
  .rb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); }
  .rb .ic { width: 20px; height: 20px; }
  .pill { height: 52px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; }
  .pill .ic { width: 18px; height: 18px; }
  @media (max-width: 680px) {
    .wrap { padding: 0 12px 32px; }
    .top { height: 60px; }
    .chip.lock span { display: none; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  }
</style>

<script type="module">
const $ = s => document.querySelector(s);
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const id = location.pathname.split("/")[2];
const key = new URLSearchParams(location.hash.slice(1)).get("k");
let exp = 0, data = null, current = null, timer = 0;

function state(big, text) {
  $("#inner").innerHTML = `<div class="empty"><div class="big">${big}</div><p>${text}</p></div>`;
}
function left(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} Tag${d > 1 ? "en" : ""} ${h} Std` : h ? `${h} Std ${mm} Min` : `${mm} Min`;
}
async function load() {
  // the key never leaves this device: it is only in the #fragment, which browsers do not send
  if (!id || !key) return state("Link unvollständig", "Bitte den Link ganz kopieren, inklusive allem nach dem #-Zeichen.");
  let r;
  try { r = await fetch(`/api/share/${id}`, { cache: "no-store", referrerPolicy: "no-referrer" }); } catch { return state("Keine Verbindung", "Bitte später noch einmal öffnen."); }
  if (!r.ok) return state("Link abgelaufen", "Dieser Link ist abgelaufen oder wurde vom Artist beendet. Frag einfach nach einem neuen.");
  exp = Number(r.headers.get("x-expires")) || 0;
  try {
    const buf = new Uint8Array(await r.arrayBuffer()), k = await crypto.subtle.importKey("raw", b64u(key), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));
    data = JSON.parse(new TextDecoder().decode(plain));
  } catch { return state("Link beschädigt", "Die Flashes ließen sich nicht entschlüsseln. Bitte den Link ganz kopieren."); }
  render(); timer = setInterval(tick, 30000);
}
function tick() {
  if (exp && exp < Date.now()) { clearInterval(timer); $("#lb").hidden = true; $("#left").hidden = true; data = null; return state("Link abgelaufen", "Die Zeit für diesen Link ist um. Frag einfach nach einem neuen."); }
  $("#left").hidden = false; $("#leftT").textContent = left(exp - Date.now());
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function edt1d(f, n, d, v, z) { // Felzenszwalb & Huttenlocher, squared distances along one line
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) ** 2 + f[v[k]]; }
}
function distanceField(inside, w, h) { // distance (px) from every pixel to the nearest inside pixel
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1), D = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) D[i] = inside[i] ? 0 : 1e20;
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = D[y * w + x]; edt1d(f, h, d, v, z); for (let y = 0; y < h; y++) D[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = D[y * w + x]; edt1d(f, w, d, v, z); for (let x = 0; x < w; x++) D[y * w + x] = Math.sqrt(d[x]); }
  return D;
}
function dieCut(c) {
  const w = c.width, h = c.height, M = Math.max(w, h), pad = M * .06, sw = Math.max(1.5, M * .006), o = Math.ceil(pad + sw) + 2;
  const W = w + 2 * o, H = h + 2 * o, cv = (a, b) => Object.assign(document.createElement("canvas"), { width: a, height: b });
  const k = Math.min(1, 900 / Math.max(W, H)), mw = Math.max(4, Math.round(W * k)), mh = Math.max(4, Math.round(H * k));
  const mc = cv(mw, mh), mg = mc.getContext("2d", { willReadFrequently: true });
  mg.drawImage(c, o * k, o * k, w * k, h * k);
  const md = mg.getImageData(0, 0, mw, mh).data, n = mw * mh, outside = new Uint8Array(n), st = [];
  const seed = i => { if (!outside[i] && md[i * 4 + 3] < 40) { outside[i] = 1; st.push(i); } };
  for (let x = 0; x < mw; x++) { seed(x); seed((mh - 1) * mw + x); }
  for (let y = 0; y < mh; y++) { seed(y * mw); seed(y * mw + mw - 1); }
  while (st.length) { const i = st.pop(), x = i % mw; if (x > 0) seed(i - 1); if (x < mw - 1) seed(i + 1); if (i >= mw) seed(i - mw); if (i < n - mw) seed(i + mw); }
  const inside = new Uint8Array(n); for (let i = 0; i < n; i++) inside[i] = outside[i] ? 0 : 1;
  const D = distanceField(inside, mw, mh), P = pad * k, SW = sw * k, img = mg.createImageData(mw, mh), px = img.data;
  for (let i = 0; i < n; i++) {
    const inner = clamp(P - D[i] + .5, 0, 1), outer = clamp(P + SW - D[i] + .5, 0, 1), ring = outer - inner, a = inner + ring;
    const v = a > 0 ? (inner * 255 + ring * 196) / a : 255; // innen weiß, Kante hellgrau
    px[i * 4] = px[i * 4 + 1] = v; px[i * 4 + 2] = v - 2; px[i * 4 + 3] = a * 255;
  }
  mg.putImageData(img, 0, 0);
  const res = cv(W, H), g = res.getContext("2d");
  g.imageSmoothingQuality = "high"; g.drawImage(mc, 0, 0, W, H); g.drawImage(c, o, o);
  return res;
}
const stickers = [];
async function render() {
  $("#inner").innerHTML = `${data.note ? `<p class="note"></p>` : ""}<div class="grid">${data.flashes.map((f, i) => `<button class="tile" data-i="${i}" style="animation-delay:${i * 40}ms" aria-label="Flash ${i + 1}"><img alt=""></button>`).join("")}</div>`;
  if (data.note) $(".note").textContent = data.note; // als Text, nie als HTML
  tick();
  const tiles = [...document.querySelectorAll(".tile")];
  for (const t of tiles) {
    const i = +t.dataset.i, f = data.flashes[i];
    t.onclick = () => open(i);
    const img = new Image(); img.src = `data:${f.type};base64,${f.data}`; await img.decode();
    const c = Object.assign(document.createElement("canvas"), { width: img.width, height: img.height }); c.getContext("2d").drawImage(img, 0, 0);
    stickers[i] = dieCut(c).toDataURL("image/png"); t.querySelector("img").src = stickers[i];
  }
}
function open(i) {
  current = data.flashes[i]; $("#lbImg").src = stickers[i] || `data:${current.type};base64,${current.data}`;
  $("#lbSave").hidden = !data.allowDownload; $("#lb").hidden = false;
}
$("#lbClose").onclick = () => { $("#lb").hidden = true; };
$("#lb").addEventListener("click", e => { if (e.target === $("#lb") || e.target.classList.contains("stage")) $("#lb").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").hidden = true; });
document.addEventListener("contextmenu", e => { if (!data?.allowDownload && e.target.tagName === "IMG") e.preventDefault(); });
$("#lbSave").onclick = () => { const a = document.createElement("a"); a.href = `data:${current.type};base64,${current.data}`; a.download = (current.name || "flash") + "." + (current.type.split("/")[1] || "png"); a.click(); };
// Anprobieren: das Flash bleibt auf dem Gerät (IndexedDB) und wird im Studio als Motiv geöffnet
$("#lbTry").onclick = async () => {
  const bin = Uint8Array.from(atob(current.data), c => c.charCodeAt(0)), blob = new Blob([bin], { type: current.type });
  await new Promise((res, rej) => {
    const rq = indexedDB.open("stencit", 1);
    rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains("flashes")) db.createObjectStore("flashes", { keyPath: "id" });
      if (!db.objectStoreNames.contains("links")) db.createObjectStore("links", { keyPath: "id" }); if (!db.objectStoreNames.contains("handoff")) db.createObjectStore("handoff"); };
    rq.onsuccess = () => { const tx = rq.result.transaction("handoff", "readwrite"); tx.objectStore("handoff").put({ blob, name: current.name || "Flash" }, "flash"); tx.oncomplete = res; tx.onerror = rej; };
    rq.onerror = rej;
  });
  location.href = "/";
};
load();
</script>
