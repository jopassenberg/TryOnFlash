<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f0; --ink: #161616; --muted: #8a8a86;
    --lime: #d9ff4a; --lime-glow: 0 0 8px rgba(217,255,74,.55);
    --cam: rgba(16,16,16,.56); --cam-2: rgba(255,255,255,.12);
    --frame: rgba(22,22,24,.88);
    --a1: #f2d9c4; --a2: #e4ff8a; --a3: #ffb3a6; --a4: #cfdcff;
    --shadow-lg: 0 2px 4px rgba(0,0,0,.04), 0 30px 60px -24px rgba(0,0,0,.28);
    --r-lg: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 300 14px/1.4 Geist, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  .sq { border-radius: var(--r-lg); }
  @supports (corner-shape: squircle) { .sq { corner-shape: squircle; border-radius: calc(var(--r-lg) * 1.6); } }

  .aura { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(70px); opacity: .7; }
  .aura i { position: absolute; border-radius: 50%; mix-blend-mode: multiply; animation: drift 18s ease-in-out infinite alternate; }
  .aura i:nth-child(1) { width: 60vmax; height: 60vmax; left: 8vmax; top: 4vmax; background: radial-gradient(circle, var(--a1) 0%, transparent 65%); }
  .aura i:nth-child(2) { width: 42vmax; height: 42vmax; right: 10vmax; top: 16vmax; background: radial-gradient(circle, var(--a2) 0%, transparent 62%); animation-duration: 22s; }
  .aura i:nth-child(3) { width: 50vmax; height: 50vmax; left: 32vmax; bottom: 2vmax; background: radial-gradient(circle, var(--a3) 0%, transparent 62%); animation-duration: 26s; }
  .aura i:nth-child(4) { width: 40vmax; height: 40vmax; left: 2vmax; bottom: 8vmax; background: radial-gradient(circle, var(--a4) 0%, transparent 62%); animation-duration: 20s; }
  @keyframes drift { from { transform: translate(-4vmax, -3vmax) scale(.95); } to { transform: translate(5vmax, 4vmax) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .aura i { animation: none; } }

  .shell { max-width: 1000px; margin: 0 auto; padding: 16px 20px 28px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 12px; height: 44px; }
  .brand { font-size: 16px; letter-spacing: .01em; margin-right: auto; }
  .steps { display: flex; gap: 6px; }
  .step { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
    background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.05); backdrop-filter: blur(14px); }
  .step i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: rgba(0,0,0,.06); }
  .step.on { color: var(--ink); background: #fff; }
  .step.on i { background: var(--ink); color: var(--lime); }
  .step.done i { background: var(--lime); color: var(--ink); }

  .frame { display: grid; gap: 8px; padding: 8px; color: #fff; --r-lg: 30px; background: var(--frame); box-shadow: var(--shadow-lg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  .stage { position: relative; overflow: hidden; background: #111; --r-lg: 22px; min-height: 360px; display: grid; place-items: center; touch-action: none; }
  .stage canvas { display: block; max-width: 100%; max-height: min(70vh, 720px); }
  #view { position: relative; }
  #overlay { position: absolute; pointer-events: none; }
  .drop { display: grid; place-items: center; gap: 14px; padding: 60px 20px; text-align: center; }
  .drop.over { background: rgba(217,255,74,.06); }
  .hint { font-size: 12.5px; color: rgba(255,255,255,.55); }
  .btn { height: 44px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn svg { width: 16px; height: 16px; }
  .btn.white { background: #fff; color: var(--ink); }
  .btn.lime { background: var(--lime); color: var(--ink); box-shadow: var(--lime-glow); }
  .btn.ghost { background: var(--cam-2); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  #ai[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: none; }
  #ai.busy svg { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { position: absolute; top: 12px; left: 12px; z-index: 3; height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; background: var(--cam); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .status[data-s="busy"] .dot { animation: blink .9s infinite; }
  .status[data-s="ok"] .dot { background: var(--lime); box-shadow: var(--lime-glow); }
  .status[data-s="err"] .dot { background: #ff7a6b; }
  @keyframes blink { 50% { opacity: .25; } }
  .views { position: absolute; top: 12px; right: 12px; z-index: 3; display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--cam); backdrop-filter: blur(16px); }
  .views button { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; color: rgba(255,255,255,.7); }
  .views button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .tagv { position: absolute; bottom: 12px; right: 12px; z-index: 3; font-size: 11px; color: var(--lime); padding: 1px 8px; border-radius: 7px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.14); }

  .panel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px; min-height: 52px; }
  .panel .grow { flex: 1; }
  .thumbs { display: flex; gap: 6px; }
  .thumb { width: 46px; height: 46px; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden; }
  .thumb img { max-width: 80%; max-height: 80%; }
  .thumb[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lime); }
  .thumb.add { background: var(--cam-2); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .chip { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--cam-2); font-size: 13px; color: rgba(255,255,255,.75); }
  .chip[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .field { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--cam-2); font-size: 12.5px; color: rgba(255,255,255,.7); }
  .field input { width: 52px; height: 26px; border: 0; border-radius: 999px; background: rgba(0,0,0,.35); color: #fff; text-align: center; }

  .needle { position: absolute; z-index: 4; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 6px rgba(217,255,74,.2), var(--lime-glow); pointer-events: none; }
  .compare { position: absolute; z-index: 3; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,.5); cursor: ew-resize; pointer-events: auto; }
  .compare::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }

  @media (max-width: 680px) {
    .shell { padding: 12px; }
    .steps .step span { display: none; }
    .step { padding: 0 8px; }
    .stage { min-height: 300px; }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="shell">
  <header class="top">
    <div class="brand">Black Moth</div>
    <nav class="steps" aria-label="Schritte">
      <div class="step" data-step="1"><i>1</i><span>Foto</span></div>
      <div class="step" data-step="2"><i>2</i><span>Analyse</span></div>
      <div class="step" data-step="3"><i>3</i><span>Platzieren</span></div>
      <div class="step" data-step="4"><i>4</i><span>Stechen</span></div>
    </nav>
  </header>

  <main class="frame sq">
    <div class="stage sq" id="stage">
      <div class="drop" id="drop">
        <button class="btn white" id="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Foto vom Arm</button>
        <div class="hint">Arm ruhig, gutes Licht, Stelle gut sichtbar</div>
      </div>
      <div id="viewWrap" hidden style="position:relative">
        <canvas id="view"></canvas>
        <canvas id="overlay"></canvas>
        <div class="compare" id="compare" hidden></div>
        <div class="needle" id="needle" hidden></div>
      </div>
      <div class="status" id="status" hidden data-s="idle"><span class="dot"></span><span id="statusText"></span></div>
      <div class="views" id="views" hidden>
        <button data-view="photo" aria-pressed="true">Foto</button>
        <button data-view="depth" aria-pressed="false">Tiefe</button>
        <button data-view="mesh" aria-pressed="false">3D</button>
      </div>
      <div class="tagv" id="tagSize" hidden></div>
    </div>

    <div class="panel" id="panelPlace" hidden>
      <div class="thumbs" id="thumbs"><button class="thumb add" id="addMotif" title="Motiv hochladen" aria-label="Motiv hochladen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <label class="field">Armbreite <input id="armCm" type="number" min="4" max="20" step="0.5" value="7.5"> cm</label>
      <span class="grow"></span>
      <button class="btn ghost" id="newPhoto">Neues Foto</button>
      <button class="btn lime" id="ink" disabled>Stechen</button>
    </div>

    <div class="panel" id="panelDone" hidden>
      <button class="chip" id="fresh" aria-pressed="false">Frisch</button>
      <button class="chip" id="healed" aria-pressed="true">Verheilt</button>
      <button class="chip" id="cmp" aria-pressed="false">Vergleich</button>
      <span class="grow"></span>
      <button class="btn ghost" id="edit">Bearbeiten</button>
      <button class="btn lime" id="ai" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>KI-Finish</button>
      <button class="btn white" id="save">Speichern</button>
    </div>
  </main>
  <input type="file" id="photoInput" accept="image/*" hidden>
  <input type="file" id="motifInput" accept="image/*" hidden>
</div>

<script type="module">
// Flash Studio: photo -> depth + skin analysis -> surface-true placement -> "stechen" render.
// Everything runs in the browser; the photo never leaves the device.
const TRANSFORMERS = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/dist/transformers.min.js";
const DEPTH_MODEL = "onnx-community/depth-anything-v2-small";
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs";
const VISION_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/wasm";
const SEG_MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const SKIN_CLASS = 2;
const RENDER_MAX = 1600, PROC_MAX = 640, PREVIEW_MAX = 900;

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const view = $("#view"), vctx = view.getContext("2d", { willReadFrequently: true });
const overlay = $("#overlay"), octx = overlay.getContext("2d");

const S = {
  step: 1, photo: null, proc: null, // render-res and model-res canvases
  disp: null, skin: null, height: null, pw: 0, ph: 0, // model-res maps
  axis: 0, armPx: 0, // arm direction (rad) and width in render px
  motifs: [], motif: null,
  anchor: null, rot: 0, sizeCm: 10, view: "photo",
  inked: null, local: null, ai: null, inkBox: null, inkAlpha: null, mode: "healed", compare: 0.5, comparing: false,
};

/* ---------- UI helpers ---------- */
function setStep(n) {
  S.step = n;
  document.querySelectorAll(".step").forEach(el => {
    const k = +el.dataset.step; el.classList.toggle("on", k === n); el.classList.toggle("done", k < n);
  });
  $("#panelPlace").hidden = n !== 3; $("#panelDone").hidden = n !== 4;
  $("#views").hidden = n < 3 && !S.disp;
  $("#tagSize").hidden = n !== 3 || !S.motif;
}
function status(text, s = "busy") {
  $("#status").hidden = !text; $("#statusText").textContent = text || ""; $("#status").dataset.s = s;
}
setStep(1);

/* ---------- 1 · Photo ---------- */
$("#pick").onclick = () => $("#photoInput").click();
$("#newPhoto").onclick = () => $("#photoInput").click();
$("#photoInput").onchange = e => e.target.files[0] && loadPhoto(e.target.files[0]);
const stage = $("#stage");
["dragenter", "dragover"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("over"); }));
stage.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (!f) return; (S.step >= 3 ? loadMotif : loadPhoto)(f); });

function scaled(img, max) {
  const k = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const c = document.createElement("canvas");
  c.width = Math.round((img.naturalWidth || img.width) * k); c.height = Math.round((img.naturalHeight || img.height) * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function loadPhoto(file) {
  const img = new Image();
  img.onload = () => {
    S.photo = scaled(img, RENDER_MAX); S.proc = scaled(img, PROC_MAX);
    S.disp = S.skin = S.height = null; S.inked = null; S.anchor = null;
    view.width = S.photo.width; view.height = S.photo.height;
    $("#drop").hidden = true; $("#viewWrap").hidden = false;
    fitOverlay(); S.view = "photo"; syncViews(); redraw();
    analyse();
  };
  img.onerror = () => status("Bild nicht lesbar", "err");
  img.src = URL.createObjectURL(file);
}
function fitOverlay() {
  overlay.width = view.clientWidth * devicePixelRatio; overlay.height = view.clientHeight * devicePixelRatio;
  overlay.style.width = view.clientWidth + "px"; overlay.style.height = view.clientHeight + "px";
  overlay.style.left = view.offsetLeft + "px"; overlay.style.top = view.offsetTop + "px";
}
new ResizeObserver(() => { if (S.photo) { fitOverlay(); drawGizmo(); } }).observe(view);

/* ---------- 2 · Analysis ---------- */
let depthPipe = null, segmenter = null;
async function getDepth() {
  if (depthPipe) return depthPipe;
  const { pipeline } = await import(TRANSFORMERS);
  const gpu = !!navigator.gpu && !!(await navigator.gpu.requestAdapter?.().catch(() => null));
  try { depthPipe = await pipeline("depth-estimation", DEPTH_MODEL, gpu ? { device: "webgpu", dtype: "fp16" } : { dtype: "q8" }); }
  catch (e) { console.warn("WebGPU depth failed, using WASM", e); depthPipe = await pipeline("depth-estimation", DEPTH_MODEL, { dtype: "q8" }); }
  return depthPipe;
}
async function getSegmenter() {
  if (segmenter) return segmenter;
  const { FilesetResolver, ImageSegmenter } = await import(VISION);
  const fs = await FilesetResolver.forVisionTasks(VISION_WASM);
  segmenter = await ImageSegmenter.createFromOptions(fs, { baseOptions: { modelAssetPath: SEG_MODEL }, runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false });
  return segmenter;
}

async function analyse() {
  setStep(2); scanStart();
  try {
    status("Lädt Modelle …");
    const [dp, seg] = await Promise.all([getDepth(), getSegmenter().catch(e => (console.warn("segmenter", e), null))]);
    status("Tiefe …");
    const url = await new Promise(r => S.proc.toBlob(b => r(URL.createObjectURL(b)), "image/jpeg", .92));
    const out = await dp(url);
    S.pw = S.proc.width; S.ph = S.proc.height;
    S.disp = resizeTensor(out.predicted_depth, S.pw, S.ph);
    status("Haut …");
    S.skin = seg ? skinMask(seg) : null;
    if (!S.skin || coverage(S.skin) < 0.03) S.skin = depthMask(S.disp);
    buildGeometry();
    status("3D …");
    await scanFinish();
    status("");
    S.anchor = { x: S.armCenter.x, y: S.armCenter.y }; S.rot = S.axis * 180 / Math.PI - 90;
    S.view = "photo"; syncViews(); setStep(3); redraw();
    if (!S.motif) status("Motiv hochladen", "ok");
  } catch (e) { console.error(e); scanStop(); status("Analyse fehlgeschlagen", "err"); }
}

function resizeTensor(t, w, h) {
  const dims = t.dims, th = dims[dims.length - 2], tw = dims[dims.length - 1], d = t.data, out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const fx = clamp((x + .5) * tw / w - .5, 0, tw - 1.001), fy = clamp((y + .5) * th / h - .5, 0, th - 1.001);
    const x0 = fx | 0, y0 = fy | 0, ax = fx - x0, ay = fy - y0, i = y0 * tw + x0;
    out[y * w + x] = (d[i] * (1 - ax) + d[i + 1] * ax) * (1 - ay) + (d[i + tw] * (1 - ax) + d[i + tw + 1] * ax) * ay;
  }
  return out;
}
function skinMask(seg) {
  const res = seg.segment(S.proc), cat = res.categoryMask, c = cat.getAsUint8Array(), m = new Float32Array(S.pw * S.ph);
  const cw = cat.width, ch = cat.height;
  for (let y = 0; y < S.ph; y++) for (let x = 0; x < S.pw; x++) {
    const v = c[Math.min(ch - 1, (y * ch / S.ph) | 0) * cw + Math.min(cw - 1, (x * cw / S.pw) | 0)];
    m[y * S.pw + x] = v === SKIN_CLASS ? 1 : 0;
  }
  cat.close(); res.close?.();
  return blurField(m, S.pw, S.ph, 2);
}
// Fallback: the arm is usually the nearest large thing in the photo. Split near/far with Otsu's
// threshold on the depth histogram, then keep only the region connected to the nearest point.
function depthMask(d) {
  const w = S.pw, h = S.ph;
  let lo = Infinity, hi = -Infinity; for (const v of d) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const bins = 128, hist = new Float64Array(bins), bin = v => Math.min(bins - 1, ((v - lo) / (hi - lo || 1) * bins) | 0);
  for (const v of d) hist[bin(v)]++;
  let total = d.length, sum = 0; for (let i = 0; i < bins; i++) sum += i * hist[i];
  let wB = 0, sB = 0, best = 0, thrBin = bins / 2;
  for (let i = 0; i < bins; i++) {
    wB += hist[i]; if (!wB || wB === total) continue; sB += i * hist[i];
    const mB = sB / wB, mF = (sum - sB) / (total - wB), between = wB * (total - wB) * (mB - mF) ** 2;
    if (between > best) { best = between; thrBin = i; }
  }
  const near = new Uint8Array(d.length); let seed = 0;
  for (let i = 0; i < d.length; i++) { near[i] = bin(d[i]) > thrBin ? 1 : 0; if (d[i] > d[seed]) seed = i; }
  const m = new Float32Array(d.length), stack = [seed]; m[seed] = 1;
  while (stack.length) { // flood fill from the nearest pixel
    const i = stack.pop(), x = i % w, y = (i / w) | 0;
    for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1])
      if (j >= 0 && near[j] && !m[j]) { m[j] = 1; stack.push(j); }
  }
  return blurField(m, w, h, 2);
}
const coverage = m => { let s = 0; for (let i = 0; i < m.length; i++) s += m[i] > .5; return s / m.length; };
function blurField(a, w, h, r) { // separable box blur, two passes ~ gaussian
  let src = a, tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let pass = 0; pass < 2; pass++) {
    for (let y = 0; y < h; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += src[y * w + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[y * w + x] = acc / (2 * r + 1); acc += src[y * w + Math.min(w - 1, x + r + 1)] - src[y * w + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc / (2 * r + 1); acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }
    src = out; out = pass === 0 ? new Float32Array(a.length) : out;
  }
  return src;
}

// Height field: relative depth inside the skin, scaled so the arm's cross-section is about as deep
// as it is wide (a forearm is roughly round). Arm axis and width come from the skin mask's PCA.
function buildGeometry() {
  const w = S.pw, h = S.ph, m = S.skin, d = S.disp;
  let n = 0, mx = 0, my = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = m[y * w + x]; if (v > .5) { n++; mx += x; my += y; } }
  mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;

  }

  const cx0 = Math.max(0, b.x0 - px), cy0 = Math.max(0, b.y0 - px), cx1 = Math.min(W, b.x0 + b.w + px), cy1 = Math.min(H, b.y0 + b.h + px), cw = cx1 - cx0, ch = cy1 - cy0;

  crop.getContext("2d").drawImage(S.local, cx0, cy0, cw, ch, 0, 0, crop.width, crop.height);

  const dg = design.getContext("2d"); dg.fillStyle = "#fff"; dg.fillRect(0, 0, design.width, design.height); dg.drawImage(S.motif.canvas, 0, 0, design.width, design.height);

  const btn = $("#ai"); btn.disabled = true; btn.classList.add("busy"); status("KI veredelt …");
  try {
    const r = await fetch("/api/ink", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: crop.toDataURL("image/jpeg", .92), design: design.toDataURL("image/jpeg", .9), mode: S.mode }) });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error === "no_key" ? "KI nicht eingerichtet" : e.error === "rate_limited" ? "Kurz warten, zu viele Anfragen" : "KI fehlgeschlagen");

    const bmp = await createImageBitmap(await r.blob());
    const aiCrop = document.createElement("canvas"); aiCrop.width = cw; aiCrop.height = ch;
    aiCrop.getContext("2d").drawImage(bmp, 0, 0, cw, ch);

    const grow = blurField(S.inkAlpha, b.w, b.h, Math.max(4, Math.round(W / 220)));

    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) mask[(y + b.y0 - cy0) * cw + (x + b.x0 - cx0)] = clamp(grow[y * b.w + x] * 3, 0, 1);
    const base = S.local.getContext("2d").getImageData(cx0, cy0, cw, ch), ai = aiCrop.getContext("2d").getImageData(0, 0, cw, ch), bd = base.data, ad = ai.data;
    for (let i = 0; i < mask.length; i++) { const m = mask[i]; if (!m) continue; for (let c = 0; c < 3; c++) bd[i * 4 + c] = bd[i * 4 + c] * (1 - m) + ad[i * 4 + c] * m; }

}
$("#ai").onclick = aiFinish;
function hash(i) { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); }
// The needle travels over the motif in quick strokes while the ink appears behind it
function needleReveal(res, box) {
  return new Promise(resolve => {
    const nd = $("#needle"), b = view.getBoundingClientRect(), wrap = $("#viewWrap").getBoundingClientRect();
    const sx = b.width / view.width, sy = b.height / view.height, rows = 9, T = 1600, t0 = performance.now();
    nd.hidden = false;
    const step = t => {
      const p = clamp((t - t0) / T, 0, 1), row = Math.min(rows - 1, Math.floor(p * rows)), rp = p * rows - row;
      const yTop = box.y0 + box.h * row / rows, yBot = box.y0 + box.h * (row + 1) / rows;
      const xNeedle = box.x0 + box.w * (row % 2 ? 1 - rp : rp);
      vctx.drawImage(S.photo, 0, 0);
      vctx.save(); vctx.beginPath(); vctx.rect(box.x0, box.y0, box.w, yTop - box.y0); vctx.rect(row % 2 ? xNeedle : box.x0, yTop, row % 2 ? box.x0 + box.w - xNeedle : xNeedle - box.x0, yBot - yTop); vctx.clip(); vctx.drawImage(res, 0, 0); vctx.restore();
      nd.style.left = (b.left - wrap.left + xNeedle * sx) + "px"; nd.style.top = (b.top - wrap.top + (yTop + yBot) / 2 * sy + Math.sin(t / 18) * 2) + "px";
      if (p < 1) requestAnimationFrame(step); else { nd.hidden = true; resolve(); }
    };
    requestAnimationFrame(step);
  });
}
$("#ink").onclick = stechen;
$("#edit").onclick = () => { S.inked = S.local = S.ai = null; S.comparing = false; $("#compare").hidden = true; setStep(3); status(""); redraw(); };

$("#cmp").onclick = () => {

};
function placeCompare() { const c = $("#compare"); c.style.left = (view.offsetLeft + S.compare * view.clientWidth) + "px"; c.style.top = view.offsetTop + "px"; c.style.height = view.clientHeight + "px"; }
