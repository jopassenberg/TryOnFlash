<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snap Body Mesh PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f3f0; --ink: #161616; --muted: #8a8a86; --lime: #d9ff4a; --cam-2: rgba(255,255,255,.12); --r: 24px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 300 14px/1.4 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [hidden] { display: none !important; }
  .shell { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
  .brand { font-size: 16px; letter-spacing: .01em; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 7px; background: rgba(0,0,0,.06); color: var(--muted); }
  .frame { display: grid; gap: 8px; padding: 8px; border-radius: 30px; background: rgba(22,22,24,.9); color: #fff; box-shadow: 0 30px 60px -24px rgba(0,0,0,.35); }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; background: #111; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .status { position: absolute; top: 12px; left: 12px; z-index: 2; height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; background: rgba(16,16,16,.56); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .status[data-s="ok"] .dot { background: var(--lime); box-shadow: 0 0 8px rgba(217,255,74,.6); }
  .status[data-s="busy"] .dot { background: #fff; animation: blink .9s infinite; }
  .status[data-s="err"] .dot { background: #ff7a6b; }
  @keyframes blink { 50% { opacity: .25; } }
  .tools { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; }
  .round { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(16,16,16,.56); color: #fff; backdrop-filter: blur(16px); }
  .round svg { width: 16px; height: 16px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; }
  .btn { height: 44px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .form { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 11px; color: rgba(255,255,255,.55); padding-left: 4px; }
  .field input { height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--cam-2); color: #fff; font-size: 13px; }
  .field input::placeholder { color: rgba(255,255,255,.35); }
  .form .btn { align-self: end; height: 40px; }
  .err { font-size: 12.5px; color: #ffb3a8; padding: 0 4px; }
  @media (max-width: 760px) { .form { grid-template-columns: 1fr; } .shell { padding: 12px; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand">Black Moth</div><span class="tag">Snap Body Mesh · PoC</span></header>

  <main class="frame">
    <div class="stage">
      <canvas id="live"></canvas>
      <div class="status" id="status" data-s="idle"><span class="dot"></span><span id="statusText">Bereit</span></div>
      <div class="tools" id="tools" hidden>
        <button class="round" id="next" title="Nächste Lens" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="round" id="flip" title="Kamera wechseln"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4v12h16z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/></svg></button>
      </div>
      <div class="empty" id="empty"><button class="btn" id="start">Kamera starten</button></div>
    </div>

    <form class="form" id="cfg" autocomplete="off">
      <div class="field"><label for="token">API Token (Staging)</label><input id="token" type="password" placeholder="eyJh…" required></div>
      <div class="field"><label for="group">Lens Group ID</label><input id="group" placeholder="Lens Group ID" required></div>
      <div class="field"><label for="lens">Lens ID (optional)</label><input id="lens" placeholder="leer = ganze Gruppe"></div>
      <button class="btn" type="submit">Speichern</button>
    </form>
    <div class="err" id="err" hidden></div>
  </main>
</div>

<script type="module">
// Snap Camera Kit Web: renders a Lens (here: Upper Body Mesh with a tattoo texture) onto a 4:3 canvas.
// Credentials stay in this browser's localStorage only; nothing is committed or sent anywhere but Snap.
// esm.sh bundles the SDK and its CommonJS dependencies (grpc-web) into one browser module
const CK = "https://esm.sh/@snap/camera-kit@1.22.0?bundle";
const $ = s => document.querySelector(s);
const KEY = "bm-snap-poc";
const W = 1280, H = 960; // 4:3 render size

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
const cfg = load();
$("#token").value = cfg.token || ""; $("#group").value = cfg.group || ""; $("#lens").value = cfg.lens || "";

function status(text, s) { $("#statusText").textContent = text; $("#status").dataset.s = s; }
function fail(msg, e) { console.error(e); status("Fehler", "err"); $("#err").textContent = msg; $("#err").hidden = false; }

$("#cfg").addEventListener("submit", e => {
  e.preventDefault();
  save({ token: $("#token").value.trim(), group: $("#group").value.trim(), lens: $("#lens").value.trim() });
  $("#err").hidden = true; status("Gespeichert", "idle");
});

let ck, session, stream, facing = "user", lenses = [], lensIdx = 0;
// The SDK keeps retrying on auth errors instead of rejecting, so every network step gets a deadline.
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
const AUTH_HINT = "Keine Antwort von Snap (meist 401: Token ungültig oder nicht der Staging-Token).";

async function startSource() {
  const { createMediaStreamSource, Transform2D } = await import(CK);
  stream?.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: W }, height: { ideal: H }, aspectRatio: { ideal: 4 / 3 } }, audio: false });
  const source = createMediaStreamSource(stream, facing === "user"
    ? { transform: Transform2D.MirrorX, cameraType: "user" } : { cameraType: "environment" });
  await session.setSource(source);
  await source.setRenderSize(W, H);
}

$("#start").onclick = async () => {
  const c = load();
  if (!c.token || !c.group) return fail("Bitte zuerst API Token und Lens Group ID eintragen und speichern.");
  $("#err").hidden = true; $("#start").disabled = true;
  try {
    status("Lädt Camera Kit …", "busy");
    const { bootstrapCameraKit } = await import(CK);
    ck = await withTimeout(bootstrapCameraKit({ apiToken: c.token }), 20000, AUTH_HINT);
    session = await withTimeout(ck.createSession({ liveRenderTarget: $("#live") }), 20000, AUTH_HINT);
    session.events.addEventListener("error", ev => fail("Lens-Fehler: " + (ev.detail?.error?.message || "unbekannt"), ev.detail));
    status("Kamera …", "busy");
    await startSource();
    status("Lädt Lens …", "busy");
    // One lens by ID, or the whole group (e.g. Snap's demo group) to flip through
    lenses = c.lens
      ? [await withTimeout(ck.lensRepository.loadLens(c.lens, c.group), 20000, "Lens nicht geladen – Lens ID, Lens Group ID oder Token prüfen.")]
      : (await withTimeout(ck.lensRepository.loadLensGroups([c.group]), 20000, "Lens Group nicht geladen – Lens Group ID oder Token prüfen.")).lenses;
    if (!lenses?.length) throw new Error("Lens nicht geladen – die Gruppe ist leer.");
    await session.applyLens(lenses[0]);
    $("#next").hidden = lenses.length < 2;
    await session.play("live");
    $("#empty").hidden = true; $("#tools").hidden = false;
    status(lenses[0].name || "Lens aktiv", "ok");
  } catch (e) {
    $("#start").disabled = false;
    const m = String(e?.message || e);
    fail(m.startsWith("Keine Antwort") || m.startsWith("Lens") ? m :
         /401|unauthor/i.test(m) ? "Token abgelehnt (401). Staging-Token aus dem Camera Kit Portal verwenden." :
         e?.name === "NotAllowedError" || /NotAllowed|Permission denied/i.test(m) ? "Kein Kamerazugriff – im Browser erlauben." :
         /lens/i.test(m) ? "Lens nicht gefunden – Lens ID und Lens Group ID prüfen." : "Start fehlgeschlagen: " + m, e);
  }
};

$("#next").onclick = async () => {
  lensIdx = (lensIdx + 1) % lenses.length;
  try { await session.applyLens(lenses[lensIdx]); status(`${lenses[lensIdx].name || "Lens"} · ${lensIdx + 1}/${lenses.length}`, "ok"); }
  catch (e) { fail("Lens konnte nicht gewechselt werden.", e); }
};
$("#flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startSource(); } catch (e) { fail("Kamera konnte nicht gewechselt werden.", e); }
};
</script>
</body>
</html>
