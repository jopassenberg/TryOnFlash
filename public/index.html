<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Try-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f0;
    --lime: #d9ff4a;                    /* the one accent, used in a few small places */
    --lime-glow: 0 0 8px rgba(217,255,74,.55);
    --a1: #f2d9c4; --a2: #e4ff8a; --a3: #ffb3a6; --a4: #cfdcff;
    --surface: #ffffff;
    --frost: rgba(255,255,255,.62);
    --ink: #161616;
    --muted: #8a8a86;
    --line: rgba(0,0,0,.07);
    --cam: rgba(16,16,16,.56);          /* surfaces floating over the camera */
    --cam-2: rgba(255,255,255,.12);     /* inset elements inside those */
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px -2px rgba(0,0,0,.08);
    --shadow-md: 0 1px 2px rgba(0,0,0,.05), 0 12px 32px -12px rgba(0,0,0,.18);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.04), 0 30px 60px -24px rgba(0,0,0,.28);
    --shadow-cam: 0 10px 30px -10px rgba(0,0,0,.45);
    --r-lg: 24px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 300 14px/1.4 Geist, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overflow-x: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }

  /* Aura background: slow, soft colour fields behind everything */
  .aura { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(70px); opacity: .7; }
  .aura i { position: absolute; border-radius: 50%; mix-blend-mode: multiply; animation: drift 18s ease-in-out infinite alternate, pulse 7s ease-in-out infinite; }
  .aura i:nth-child(1) { width: 60vmax; height: 60vmax; left: 8vmax; top: 4vmax; background: radial-gradient(circle, var(--a1) 0%, transparent 65%); }
  .aura i:nth-child(2) { width: 42vmax; height: 42vmax; right: 10vmax; top: 16vmax; background: radial-gradient(circle, var(--a2) 0%, transparent 62%); animation-duration: 22s, 8s; animation-delay: -6s, -2s; }
  .aura i:nth-child(3) { width: 50vmax; height: 50vmax; left: 32vmax; bottom: 2vmax; background: radial-gradient(circle, var(--a3) 0%, transparent 62%); animation-duration: 26s, 9s; animation-delay: -12s, -4s; }
  .aura i:nth-child(4) { width: 40vmax; height: 40vmax; left: 2vmax; bottom: 8vmax; background: radial-gradient(circle, var(--a4) 0%, transparent 62%); animation-duration: 20s, 10s; animation-delay: -3s, -1s; }
  @keyframes drift { from { transform: translate(-4vmax, -3vmax) scale(.95); } to { transform: translate(5vmax, 4vmax) scale(1.08); } }
  @keyframes pulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .aura i { animation: none; } }
  svg { flex: none; }

  /* Squircle corners where supported (corner-shape), regular radii elsewhere */
  .sq { border-radius: var(--r-lg); }
  @supports (corner-shape: squircle) { .sq { corner-shape: squircle; border-radius: calc(var(--r-lg) * 1.6); } }

  .pill { display: inline-flex; align-items: center; gap: var(--s2); height: 40px; padding: 0 var(--s4); border-radius: 999px; font-weight: 300; white-space: nowrap;
    background: var(--frost); box-shadow: var(--shadow-sm); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: box-shadow .15s, transform .1s; }
  .pill:hover { box-shadow: var(--shadow-md); }
  .pill:active { transform: scale(.98); }
  .pill .lbl { color: var(--muted); font-weight: 300; }
  .pill svg { width: 14px; height: 14px; color: var(--muted); }
  .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .round svg { width: 18px; height: 18px; }
  .on-cam { background: var(--cam); color: #fff; box-shadow: var(--shadow-cam); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .on-cam[aria-pressed="true"] { background: #fff; color: var(--ink); }

  /* ---------- Shell ---------- */
  .shell { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); gap: var(--s4); padding: var(--s4) var(--s5) var(--s5); }
  .top { position: relative; z-index: 20; display: flex; align-items: center; }
  .brand { font-weight: 300; font-size: 16px; letter-spacing: .01em; margin-right: auto; }
  .top-center { position: absolute; left: 50%; transform: translateX(-50%); }

  .pop { position: absolute; z-index: 30; top: calc(100% + var(--s2)); left: 50%; transform: translateX(-50%); width: min(400px, calc(100vw - 32px)); padding: var(--s4);
    background: var(--surface); box-shadow: var(--shadow-lg); --r-lg: 20px; }
  .pop h5 { margin: var(--s4) 0 var(--s2); font-size: 11px; font-weight: 300; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pop h5:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .chip { height: 32px; padding: 0 var(--s3); border-radius: 999px; background: var(--bg); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .work { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--s4); min-height: 0; }

  /* ---------- Flash rail ---------- */
  .flashes { display: flex; flex-direction: column; gap: var(--s3); overflow: auto; padding: var(--s1); margin: calc(var(--s1) * -1); scrollbar-width: none; min-height: 0; }
  .flashes::-webkit-scrollbar { display: none; }
  .flash { position: relative; flex: none; width: 100%; aspect-ratio: 1; background: var(--surface); box-shadow: var(--shadow-sm); --r-lg: 18px; transition: box-shadow .15s, transform .15s; }
  .flash:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .flash img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; }
  .flash[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink), var(--shadow-md); }
  .flash.add { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.14); display: grid; place-items: center; color: var(--ink); }
  .flash.add:hover { background: var(--surface); box-shadow: var(--shadow-sm); }
  .flash.add svg { width: 20px; height: 20px; }

  /* ---------- Stage ---------- */
  .center { position: relative; min-height: 0; min-width: 0; display: flex; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #111; --r-lg: 28px; box-shadow: var(--shadow-lg); touch-action: none; outline: none; isolation: isolate; }
  .stage:has(.intro:not([hidden])) { background: var(--frost); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  #view { width: 100%; height: 100%; display: block; object-fit: cover; }
  #view.mirror { transform: scaleX(-1); }
  video { display: none; }

  .hud { position: absolute; z-index: 4; top: var(--s3); left: var(--s3); right: var(--s3); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .stage:has(.intro:not([hidden])) .hud { display: none; }
  .status { height: 32px; padding: 0 var(--s3); font-size: 12.5px; border-radius: 999px; display: inline-flex; align-items: center; gap: var(--s2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .status[data-state="ok"] .dot { background: var(--lime); box-shadow: var(--lime-glow); }
  .status[data-state="search"] .dot, .status[data-state="busy"] .dot { background: #fff; animation: blink .9s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .stage-tools { display: flex; gap: var(--s2); }
  .stage-tools .round { width: 36px; height: 36px; }
  .stage-tools .round svg { width: 16px; height: 16px; }

  .coach { position: absolute; z-index: 4; left: 50%; top: 56px; transform: translateX(-50%); padding: var(--s2) var(--s3); border-radius: 999px; font-size: 12.5px; white-space: nowrap; pointer-events: none; }

  .intro { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; }
  .btn { height: 44px; padding: 0 var(--s5); border-radius: 999px; font-weight: 300; display: inline-flex; align-items: center; gap: var(--s2); }
  .btn svg { width: 16px; height: 16px; }
  .btn.dark svg { color: var(--lime); }
  .btn.dark { background: var(--ink); color: #fff; box-shadow: var(--shadow-md); }
  .btn.dark:hover { box-shadow: var(--shadow-lg); }
  .btn.soft { background: var(--bg); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }

  .no-flash { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .stage:has(.intro:not([hidden])) .no-flash { display: none; }

  /* ---------- Dock: one surface for position, rotation and size ---------- */
  .dock { position: absolute; z-index: 4; left: 50%; bottom: var(--s3); transform: translateX(-50%); width: min(440px, calc(100% - 24px)); padding: 6px; color: #fff; --r-lg: 22px;
    display: flex; gap: 6px; background: var(--cam); box-shadow: var(--shadow-cam); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .stage:has(.intro:not([hidden])) .dock { display: none; }

  .map { position: relative; flex: 1; height: 148px; touch-action: none; cursor: crosshair; --r-lg: 16px; background: var(--cam-2); }
  .map .grid { position: absolute; inset: 24px 30px; pointer-events: none;
    background-image: radial-gradient(circle at center, rgba(255,255,255,.2) 0.9px, transparent 1.3px); background-size: 14px 14px; }
  .map .axis { position: absolute; left: 50%; top: 24px; bottom: 24px; width: 1px; background: rgba(255,255,255,.1); }
  .map .lbl, .map .read { position: absolute; font-size: 10.5px; pointer-events: none; white-space: nowrap; }
  .map .lbl { color: rgba(255,255,255,.55); letter-spacing: .02em; }
  .map .l-top { top: 7px; left: 50%; transform: translateX(-50%); }
  .map .l-bot { bottom: 7px; left: 50%; transform: translateX(-50%); }
  .map .l-left { left: 13px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
  .map .l-right { right: 13px; top: 50%; transform: translate(50%, -50%) rotate(90deg); }
  .map .read { color: var(--lime); line-height: 16px; padding: 1px 7px; border-radius: 7px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .map .r-size { top: 6px; right: 8px; }
  .map .r-rot { bottom: 6px; right: 8px; }

  /* Gizmo: glass disc with a lime sector for the current rotation, a grip on its rim,
     and a degree scale + value bubble that spring open while the grip is held. */
  .gizmo { position: absolute; width: 0; height: 0; pointer-events: none; transition: left .08s ease-out, top .08s ease-out; }
  .g-ring { position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.14);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15), 0 4px 18px -6px rgba(0,0,0,.5);
    transition: width .16s cubic-bezier(.3,1.5,.5,1), height .16s cubic-bezier(.3,1.5,.5,1), border-color .2s; }
  .g-ticks { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(.85); opacity: 0;
    background: repeating-conic-gradient(rgba(255,255,255,.55) 0deg 1.2deg, transparent 1.2deg 15deg);
    -webkit-mask: radial-gradient(circle, transparent calc(50% - 6px), #000 calc(50% - 6px) calc(50% - 1px), transparent 50%);
    mask: radial-gradient(circle, transparent calc(50% - 6px), #000 calc(50% - 6px) calc(50% - 1px), transparent 50%);
    transition: opacity .2s, transform .3s cubic-bezier(.3,1.5,.5,1); }
  .g-dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--lime);
    box-shadow: var(--lime-glow), 0 2px 6px rgba(0,0,0,.4); animation: breathe 2.6s ease-in-out infinite; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  @keyframes breathe { 50% { box-shadow: 0 0 0 7px rgba(217,255,74,.12), var(--lime-glow), 0 2px 6px rgba(0,0,0,.4); } }
  .g-knob { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center;
    box-shadow: 0 0 0 0 rgba(217,255,74,0), 0 3px 10px rgba(0,0,0,.45); pointer-events: auto; cursor: grab; touch-action: none;
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, left .06s ease-out, top .06s ease-out; }
  .g-knob svg { width: 15px; height: 15px; }
  .g-knob:hover { transform: scale(1.08); }
  .g-bubble { position: absolute; padding: 3px 9px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 11px; white-space: nowrap; pointer-events: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); opacity: 0; transform: translate(-50%, -100%) scale(.6); transform-origin: 50% 100%;
    transition: opacity .15s, transform .22s cubic-bezier(.3,1.6,.5,1), left .06s ease-out, top .06s ease-out; }
  .map.knob-drag .g-ring { border-color: #fff; }
  .map.knob-drag .g-ticks { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .map.knob-drag .g-knob { transform: scale(1.18); cursor: grabbing; box-shadow: 0 0 0 3px var(--lime), 0 0 18px rgba(217,255,74,.5), 0 3px 10px rgba(0,0,0,.45); }
  .map.knob-drag .g-bubble { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .map.dragging .g-dot { transform: scale(1.4); }
  .map.snapped .g-ticks { animation: tick-flash .35s ease-out; }
  .map.snapped .g-knob { animation: knob-pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes tick-flash { 0% { filter: brightness(2.2); } }
  @keyframes knob-pop { 40% { transform: scale(1.32); } }
  @media (prefers-reduced-motion: reduce) { .g-dot { animation: none; } }

  /* Toolbar: one rail, buttons press in and the active ones light up */
  .dock-side { display: grid; grid-template-rows: repeat(5, 1fr); gap: 2px; width: 64px; padding: 3px; border-radius: 14px; background: var(--cam-2); }
  .ibtn { position: relative; border-radius: 11px; font-size: 11.5px; font-weight: 300; color: rgba(255,255,255,.65); display: grid; place-items: center;
    transition: background .28s cubic-bezier(.3,1.4,.5,1), color .2s, transform .12s ease-out; }
  .ibtn:hover { color: #fff; background: rgba(255,255,255,.06); }
  .ibtn:active { transform: scale(.9); }
  .ibtn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .ibtn[aria-pressed="true"]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
  .ibtn svg { width: 15px; height: 15px; transition: transform .4s cubic-bezier(.3,1.4,.5,1); }
  .ibtn:active svg { transform: rotate(-120deg); }

  /* ---------- 3D skeleton inset ---------- */
  .skel3d { position: absolute; z-index: 4; top: 56px; left: var(--s3); width: 132px; height: 168px; --r-lg: 18px; pointer-events: none; }

  /* ---------- First-visit intro ---------- */
  .onb { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(242,242,240,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .onb-card { width: min(300px, calc(100% - 32px)); padding: var(--s5) var(--s5) var(--s4); background: var(--surface); box-shadow: var(--shadow-lg); --r-lg: 26px; text-align: center; }
  .onb-art { height: 120px; display: grid; place-items: center; margin-bottom: var(--s4); border-radius: 18px; background: var(--bg); overflow: hidden; }
  .onb-step { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .onb h3 { margin: 0 0 var(--s4); font-size: 17px; font-weight: 300; letter-spacing: -.01em; }
  .onb-dots { display: flex; justify-content: center; gap: 5px; margin-bottom: var(--s4); }
  .onb-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(0,0,0,.15); transition: width .2s; }
  .onb-dots i.on { width: 16px; border-radius: 3px; background: var(--ink); }
  .onb-row { display: flex; gap: var(--s2); }
  .onb-row .btn { flex: 1; justify-content: center; height: 40px; padding: 0; }
  /* Pictograms */
  .art-up { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-md); animation: bob 1.8s ease-in-out infinite; }
  .art-up svg { width: 22px; height: 22px; }
  .art-zone { display: flex; gap: 6px; }
  .art-zone span { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 11px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); animation: pick 3.6s infinite; }
  .art-zone span:nth-child(2) { animation-delay: 1.2s; } .art-zone span:nth-child(3) { animation-delay: 2.4s; }
  .art-giz { position: relative; width: 96px; height: 96px; animation: spin 4s ease-in-out infinite; }
  .art-giz .g-ring { left: 50%; top: 50%; width: 70px; height: 70px; border-color: rgba(0,0,0,.25); }
  .art-giz .g-dot { left: 50%; top: 50%; background: var(--ink); }
  .art-giz .g-knob { left: 50%; top: 13px; background: var(--ink); color: #fff; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes pick { 0%, 30%, 100% { background: var(--surface); color: var(--ink); } 5%, 25% { background: var(--ink); color: #fff; } }
  @keyframes spin { 0%, 10% { transform: rotate(0) scale(.85); } 50%, 60% { transform: rotate(120deg) scale(1.1); } 100% { transform: rotate(0) scale(.85); } }
  @media (prefers-reduced-motion: reduce) { .art-up, .art-zone span, .art-giz { animation: none; } }

  .toast { position: fixed; z-index: 50; top: var(--s4); left: 50%; transform: translate(-50%, -8px); padding: var(--s2) var(--s4); border-radius: 999px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; background: var(--ink); color: #fff; box-shadow: var(--shadow-md); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Upload / background remover ---------- */
  dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); box-shadow: var(--shadow-lg); --r-lg: 28px; }
  dialog::backdrop { background: rgba(0,0,0,.25); }
  #convDlg { width: min(960px, calc(100vw - 32px)); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: var(--s4) var(--s4) 0 var(--s5); }
  .dlg-head h2 { margin: 0; font-size: 16px; font-weight: 300; }
  .dlg-head .round { width: 36px; height: 36px; background: var(--bg); }
  .conv { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); padding: var(--s4) var(--s5); }
  .pane { position: relative; overflow: hidden; height: min(48vh, 420px); display: grid; place-items: center; background: var(--bg); --r-lg: 18px; }
  .pane-label { position: absolute; top: var(--s2); left: var(--s2); z-index: 2; font-size: 11px; padding: 3px var(--s2); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); }
  .pane.out { background-color: #fff; background-image: conic-gradient(#f0f0ee 25%, #fff 0 50%, #f0f0ee 0 75%, #fff 0); background-size: 16px 16px; }
  .pane canvas { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; display: block; }
  #cvSrc { cursor: crosshair; touch-action: none; }
  .drop { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; }
  .drop .btn { pointer-events: none; }
  .drop.over { background: rgba(0,0,0,.04); }
  .conv-controls { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; padding: 0 var(--s5) var(--s5); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg); }
  .seg button { height: 30px; padding: 0 var(--s3); border-radius: 999px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .sl { width: 140px; }
  .sl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .sl output { color: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: rgba(0,0,0,.12); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(0,0,0,.12); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm), 0 0 0 1px rgba(0,0,0,.08); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm), 0 0 0 1px rgba(0,0,0,.08); }
  .chk { height: 32px; padding: 0 var(--s3); border-radius: 999px; font-size: 13px; background: var(--bg); color: var(--muted); }
  .chk[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .conv-controls .actions { margin-left: auto; display: flex; gap: var(--s2); }
  .conv-foot { padding: 0 var(--s5) var(--s4); margin-top: calc(var(--s3) * -1); font-size: 12px; color: var(--muted); min-height: 0; }
  .conv-foot:empty { display: none; }

  /* ---------- Phones ---------- */
  @media (max-width: 760px) {
    .shell { padding: var(--s3); gap: var(--s3); grid-template-rows: 40px minmax(0, 1fr); }
    .top-center { position: static; transform: none; }
    .top-center .pill { height: 36px; padding: 0 var(--s3); }
    .work { display: flex; flex-direction: column; gap: var(--s3); }
    .center { flex: 1; min-height: 0; }
    .rail { order: 2; flex: none; }
    .flashes { flex-direction: row; overflow-x: auto; }
    .flash { width: 64px; --r-lg: 14px; }
    .flash img { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
    .stage { --r-lg: 24px; }
    .dock { bottom: var(--s2); width: calc(100% - 16px); }
    .map { height: 124px; }

    .skel3d { top: 52px; left: var(--s2); width: 104px; height: 132px; }
    .conv { grid-template-columns: 1fr; padding: var(--s3) var(--s4); }
    .pane { height: 30vh; }
    .conv-controls { padding: 0 var(--s4) var(--s4); gap: var(--s3); }
    .sl { flex: 1; min-width: 120px; }
    .conv-controls .actions { margin-left: 0; width: 100%; }
    .conv-controls .actions .btn { flex: 1; justify-content: center; }
  }
</style>

<script type="module">
// MediaPipe is imported on camera start, so the UI renders immediately on slow connections.
const VISION_BUNDLE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const POSE_FULL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task";
const POSE_LITE = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const HAND = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
// Multiclass selfie segmenter: 0 background, 1 hair, 2 body skin, 3 face skin, 4 clothes, 5 accessories
const SKIN_SEG = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const SKIN_CLASS = 2;
const PROFILE_STATIONS = 9; // width measurements along the limb across the tattoo's height
const isMobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
const DESIGN_BASE = 600; // unrotated design height in px inside the design canvas

/* ================= Flashes (added through the upload / background remover) ================= */
const DESIGNS = [];

/* ================= Body zones ================= */
// a/b: pose landmark indices (proximal -> distal). R: real skin radius in cm. len: typical segment length in cm.
const ZONES = {
  forearm_l:  { label: "Linker Unterarm",  group: "Arme",  model: "pose", kind: "limb", a: 13, b: 15, tw: [17, 19], R: 4.0, len: 26, t: 0.55, size: 12, coach: "Ellbogen + Handgelenk ins Bild" },
  forearm_r:  { label: "Rechter Unterarm", group: "Arme",  model: "pose", kind: "limb", a: 14, b: 16, tw: [18, 20], R: 4.0, len: 26, t: 0.55, size: 12, coach: "Ellbogen + Handgelenk ins Bild" },
  upperarm_l: { label: "Linker Oberarm",   group: "Arme",  model: "pose", kind: "limb", a: 11, b: 13, R: 5.0, len: 30, t: 0.5,  size: 12, coach: "Schulter + Ellbogen ins Bild" },
  upperarm_r: { label: "Rechter Oberarm",  group: "Arme",  model: "pose", kind: "limb", a: 12, b: 14, R: 5.0, len: 30, t: 0.5,  size: 12, coach: "Schulter + Ellbogen ins Bild" },
  calf_l:     { label: "Linke Wade",       group: "Beine", model: "pose", kind: "limb", a: 25, b: 27, R: 5.5, len: 40, t: 0.4,  size: 14, coach: "Knie + Knöchel ins Bild" },
  calf_r:     { label: "Rechte Wade",      group: "Beine", model: "pose", kind: "limb", a: 26, b: 28, R: 5.5, len: 40, t: 0.4,  size: 14, coach: "Knie + Knöchel ins Bild" },
  chest:      { label: "Brust",            group: "Oberkörper", model: "pose", kind: "chest", R: 20, t: 0.22, size: 16, coach: "Schultern ins Bild" },
  hand:       { label: "Handrücken",       group: "Nahaufnahme", model: "hand", kind: "hand", R: 4.2, t: 0.5, size: 6, coach: "Handrücken ins Bild" },
  forearm_close: { label: "Unterarm (nah)", group: "Nahaufnahme", model: "hand", kind: "forearmClose", R: 3.8, t: 0.5, size: 10, coach: "Hand + Unterarm ins Bild" },
};

/* ================= State ================= */
const $ = s => document.querySelector(s);
const stage = $("#stage"), view = $("#view"), ctx = view.getContext("2d");
const video = $("#video");
const overlay = document.createElement("canvas"), octx = overlay.getContext("2d");
const freezeCanvas = document.createElement("canvas");

const state = {
  designId: null, zone: "forearm_l", size: 12, rot: 0, t: 0.55, roll: 0, opacity: 0.9,
  wrap: true, clip: true, debug: false, stab: false,
  facing: "user", srcType: null, photo: null, mirror: false, frozen: false,
  track: null, lastSeen: 0, vis: 0, lastFrame: null, lm: null,
  dc: null, designImg: null,
};
// body: person silhouette from the pose model (measures limb width, also through sleeves)
// skin: body-skin class from the multiclass segmenter (tattoo is only drawn here)
const masks = { body: null, skin: null };
let pose = null, hands = null, segmenter = null, modelsReady = false, modelsPromise = null;
let lastTs = 0, lastVideoTime = -1, lastDetect = 0, segTick = 0;
const SEG_EVERY = isMobile ? 3 : 2;
// The models work on small inputs internally (256 px), so feeding them the full camera frame only costs
// resize time and makes their output masks huge. Pose gets a mid-size copy for landmark precision,
// the segmenter a small one, so reading its masks back from the GPU stays cheap.
const POSE_IN_W = 640, SEG_IN_W = 256, SEG_DELEGATE = "GPU";
const BG_CLASS = 0;
const poseIn = document.createElement("canvas"), segIn = document.createElement("canvas");
function scaledInput(src, cv, w) {
  const W = srcW(), H = srcH(); if (W <= w) return src;
  const h = Math.round(H * w / W);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  cv.getContext("2d").drawImage(src, 0, 0, w, h);
  return cv;
}

/* ================= One Euro filter (jitter vs. lag) ================= */
class OneEuro {
  constructor(minCutoff = 1.0, beta = 0.015, dCutoff = 1.0) { Object.assign(this, { minCutoff, beta, dCutoff }); this.reset(); }
  reset() { this.x = null; this.dx = 0; this.t = 0; }
  a(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3); this.t = t;
    const ad = this.a(this.dCutoff, dt);
    this.dx = ad * ((x - this.x) / dt) + (1 - ad) * this.dx;
    const al = this.a(this.minCutoff + this.beta * Math.abs(this.dx), dt);
    return this.x = al * x + (1 - al) * this.x;
  }
}
const F = { ax: new OneEuro(), ay: new OneEuro(), bx: new OneEuro(), by: new OneEuro(),
  r: new OneEuro(0.8, 0.01), fs: new OneEuro(0.5, 0) };
const stationF = Array.from({ length: PROFILE_STATIONS }, () => ({ r: new OneEuro(0.8, 0.01), off: new OneEuro(0.8, 0.01) }));
const resetFilters = () => {
  resetTwist();
  resetFlow();
  Object.values(F).forEach(f => f.reset());
  stationF.forEach(s => { s.r.reset(); s.off.reset(); });
};

/* ================= Helpers ================= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const dist3 = (p, q) => Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z);
const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, z: ((p.z ?? 0) + (q.z ?? 0)) / 2 });
const srcEl = () => state.srcType === "video" ? video : state.photo;
const srcW = () => state.srcType === "video" ? video.videoWidth : state.photo?.naturalWidth;
const srcH = () => state.srcType === "video" ? video.videoHeight : state.photo?.naturalHeight;
const downloadBlob = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3400);
}
let lastPill = "";
function setStatus(text, s) {
  const key = text + s; if (key === lastPill) return; lastPill = key;
  $("#pillText").textContent = text; $("#pill").dataset.state = s;
}
function setCoach(text) {
  const el = $("#coach");
  if (!text) { el.hidden = true; return; }
  if (el.textContent !== text) el.textContent = text;
  el.hidden = false;
}

/* ================= Models ================= */
function loadModels() {
  if (modelsPromise) return modelsPromise;
  modelsPromise = (async () => {
    setStatus("Lädt …", "busy");
    const { FilesetResolver, PoseLandmarker, HandLandmarker, ImageSegmenter } = await import(VISION_BUNDLE);
    const vision = await FilesetResolver.forVisionTasks(WASM);
    const create = async (Cls, opts, delegate = "GPU") => {
      try { return await Cls.createFromOptions(vision, { ...opts, baseOptions: { ...opts.baseOptions, delegate } }); }
      catch (e) { console.warn("GPU delegate failed, falling back to CPU", e);
        return Cls.createFromOptions(vision, { ...opts, baseOptions: { ...opts.baseOptions, delegate: "CPU" } }); }
    };
    [pose, hands] = await Promise.all([
      create(PoseLandmarker, { baseOptions: { modelAssetPath: isMobile ? POSE_LITE : POSE_FULL }, runningMode: "VIDEO",
        numPoses: 1, outputSegmentationMasks: false, minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5 }),
      create(HandLandmarker, { baseOptions: { modelAssetPath: HAND }, runningMode: "VIDEO", numHands: 1 }),
    ]);
    modelsReady = true;
    // Skin segmentation is an upgrade, not a requirement: tracking keeps working without it.
    try {
      segmenter = await create(ImageSegmenter, { baseOptions: { modelAssetPath: SKIN_SEG }, runningMode: "VIDEO",
        outputCategoryMask: true, outputConfidenceMasks: false }, SEG_DELEGATE);
    } catch (e) { console.warn("Skin segmenter unavailable", e); }
  })();
  modelsPromise.catch(e => { console.error(e); setStatus("Fehler", "idle"); modelsPromise = null; });
  return modelsPromise;
}

/* ================= Detection ================= */
// Rolling per-stage timings (ms), handy for tuning on real phones: window.__tryon.state.perf
state.perf = {};
const perfMark = (k, t0) => { const v = performance.now() - t0; state.perf[k] = state.perf[k] == null ? v : state.perf[k] * 0.8 + v * 0.2; };
function detect(src) {
  let ts = performance.now(); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
  const z = ZONES[state.zone], W = srcW(), H = srcH();
  const P = l => ({ x: l.x * W, y: l.y * H });
  let raw = null;

  const t0 = performance.now();
  if (z.model === "pose") {
    const res = pose.detectForVideo(scaledInput(src, poseIn, POSE_IN_W), ts);
    perfMark("pose", t0);
    const lm = res.landmarks?.[0], wl = res.worldLandmarks?.[0];
    state.world = wl || null; state.worldKind = "pose";
    if (state.stab && z.tw && wl) updateTwist(wl, z);
    state.lm = lm ? lm.map(P) : null;
    if (lm) {
      if (z.kind === "limb") {
        const a = lm[z.a], b = lm[z.b];
        raw = { A: P(a), B: P(b), vis: Math.min(a.visibility ?? 1, b.visibility ?? 1), worldLen: wl ? dist3(wl[z.a], wl[z.b]) : 0, rHint: null };
      } else { // chest: shoulder-mid -> hip-mid, width from shoulders
        const ls = lm[11], rs = lm[12];
        raw = { A: mid(P(ls), P(rs)), B: mid(P(lm[23]), P(lm[24])), vis: Math.min(ls.visibility ?? 1, rs.visibility ?? 1),
          worldLen: wl ? dist3(mid(wl[11], wl[12]), mid(wl[23], wl[24])) : 0, rHint: dist(P(ls), P(rs)) / 2 };
      }
    }
  } else {
    const res = hands.detectForVideo(scaledInput(src, poseIn, POSE_IN_W), ts);
    const lm = res.landmarks?.[0];
    state.world = res.worldLandmarks?.[0] || null; state.worldKind = "hand";
    state.lm = lm ? lm.map(P) : null;
    if (lm) {
      const wr = P(lm[0]), mc = P(lm[9]), width = dist(P(lm[5]), P(lm[17]));
      if (z.kind === "hand") raw = { A: wr, B: mc, vis: 1, rHint: width * 0.56, worldLen: 0 };
      else raw = { A: { x: wr.x + (wr.x - mc.x) * 2.4, y: wr.y + (wr.y - mc.y) * 2.4 }, B: wr, vis: 1, rHint: width * 0.5, worldLen: 0 };
    }
  }

  if (segmenter && ++segTick % SEG_EVERY === 0) {
    const t2 = performance.now();
    const sres = segmenter.segmentForVideo(scaledInput(src, segIn, SEG_IN_W), ts);
    perfMark("seg", t2);
    // One read-back per frame: the category mask holds the class of every pixel, from which we derive
    // the skin mask and the body silhouette (everything that isn't background: skin, clothes, hair ...)
    const t3 = performance.now(), cat = sres.categoryMask;
    if (cat) {
      const w = cat.width, h = cat.height, c = cat.getAsUint8Array();
      const skin = new Float32Array(c.length), body = new Float32Array(c.length);
      for (let i = 0; i < c.length; i++) { skin[i] = c[i] === SKIN_CLASS ? 1 : 0; body[i] = c[i] === BG_CLASS ? 0 : 1; }
      masks.skin = toMask(skin, w, h, masks.skin, [255, 255, 255]);
      masks.body = toMask(body, w, h, masks.body, [255, 255, 255]);
      cat.close();
    }
    perfMark("masks", t3);
  }

  if (raw && raw.vis > 0.5) {
    const now = performance.now();
    state.lastSeen = now;
    state.track = {
      A: { x: F.ax.filter(raw.A.x, now), y: F.ay.filter(raw.A.y, now) },
      B: { x: F.bx.filter(raw.B.x, now), y: F.by.filter(raw.B.y, now) },
      rHint: raw.rHint, worldLen: raw.worldLen,
    };
  }
}

// Copies a confidence mask into {arr, w, h, canvas}. Blends with the previous frame to stop edge flicker;
// the canvas carries the mask as alpha (for clipping) tinted with `rgb` (for the debug overlay).
function toMask(src, w, h, prev, rgb) {
  let arr;
  if (prev && prev.w === w && prev.h === h) { arr = prev.arr; for (let i = 0; i < arr.length; i++) arr[i] = arr[i] * 0.35 + src[i] * 0.65; }
  else arr = new Float32Array(src);
  const canvas = prev?.canvas ?? document.createElement("canvas");
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const gx = canvas.getContext("2d"), img = gx.createImageData(w, h), d = img.data;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i], o = i * 4;
    d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2];
    d[o + 3] = v < 0.35 ? 0 : v > 0.65 ? 255 : ((v - 0.35) / 0.3) * 255;
  }
  gx.putImageData(img, 0, 0);
  return { arr, w, h, canvas };
}
function maskAt(mask, x, y) {
  const mx = (x * mask.w / view.width) | 0, my = (y * mask.h / view.height) | 0;

  for (let i = 0; i < grid.length; i += 4) if (lum(i) < paperL * 0.78) grid[i + 3] = 0;
  for (let pass = 0; pass < 12; pass++) {
    let missing = false;
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const o = (gy * gw + gx) * 4; if (grid[o + 3]) continue;
      let r = 0, g = 0, b = 0, n = 0;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const x = gx + dx, y = gy + dy; if (x < 0 || y < 0 || x >= gw || y >= gh) continue;
        const q = (y * gw + x) * 4; if (grid[q + 3] !== 1) continue;
        r += grid[q]; g += grid[q + 1]; b += grid[q + 2]; n++;
      }
      if (n) { grid[o] = r / n; grid[o + 1] = g / n; grid[o + 2] = b / n; grid[o + 3] = 2; } else missing = true;
    }
    for (let i = 3; i < grid.length; i += 4) if (grid[i] === 2) grid[i] = 1;
    if (!missing) break;
  }
  for (let i = 0; i < grid.length; i += 4) if (!grid[i + 3]) { grid[i] = grid[i + 1] = grid[i + 2] = paperL; }
  // Bilinear lookup of the paper colour at any pixel
  return (x, y, out) => {
    const fx = clamp(x / cs - 0.5, 0, gw - 1), fy = clamp(y / cs - 0.5, 0, gh - 1);
    const x0 = fx | 0, y0 = fy | 0, x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1), tx = fx - x0, ty = fy - y0;
    for (let c = 0; c < 3; c++) {
      const a = grid[(y0 * gw + x0) * 4 + c], b = grid[(y0 * gw + x1) * 4 + c], e = grid[(y1 * gw + x0) * 4 + c], f = grid[(y1 * gw + x1) * 4 + c];
      out[c] = (a * (1 - tx) + b * tx) * (1 - ty) + (e * (1 - tx) + f * tx) * ty;
    }
  };
}

function extractInk(maxSide) {
  const s = conv.src, c = conv.crop;
  const sx = Math.round(c.x * s.width), sy = Math.round(c.y * s.height);
  const sw = Math.max(1, Math.round(c.w * s.width)), sh = Math.max(1, Math.round(c.h * s.height));
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
  const work = document.createElement("canvas"); work.width = w; work.height = h;
  const wx = work.getContext("2d", { willReadFrequently: true });
  wx.drawImage(s, sx, sy, sw, sh, 0, 0, w, h);
  const img = wx.getImageData(0, 0, w, h), d = img.data;
  const paper = estimatePaper(d, w, h, conv.flat), bg = [0, 0, 0];
  const thr = conv.thr, str = conv.str, black = conv.mode === "black";
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    paper(x, y, bg);
    const nr = Math.min(1, d[i] / Math.max(bg[0], 1)), ng = Math.min(1, d[i + 1] / Math.max(bg[1], 1)), nb = Math.min(1, d[i + 2] / Math.max(bg[2], 1));
    const a0 = black ? 1 - (nr * 0.299 + ng * 0.587 + nb * 0.114) : 1 - Math.min(nr, ng, nb);
    const a = clamp((a0 - thr) / (1 - thr) * str, 0, 1);
    if (a <= 0.01) { d[i + 3] = 0; continue; }
    if (black) { d[i] = 20; d[i + 1] = 18; d[i + 2] = 16; }
    else { // un-composite from white paper: observed = a·ink + (1-a)·white
      const inv = 1 - a0, q = 255 / Math.max(a0, 0.05);
      d[i] = clamp((nr - inv) * q, 0, 255); d[i + 1] = clamp((ng - inv) * q, 0, 255); d[i + 2] = clamp((nb - inv) * q, 0, 255);
    }
    d[i + 3] = a * 255;
    if (a > 0.08) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  if (maxX < 0) return null;
  wx.putImageData(img, 0, 0);
  const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03);
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const out = document.createElement("canvas"); out.width = maxX - minX + 1; out.height = maxY - minY + 1;
  out.getContext("2d").drawImage(work, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

let convTimer;
function processConv() {
  if (!conv.src) return;
  clearTimeout(convTimer);
  convTimer = setTimeout(() => {
    const prev = extractInk(900);
    const gx = cvOut.getContext("2d");
    if (!prev) { cvOut.width = 1; cvOut.height = 1; $("#convInfo").textContent = "Keine Linien erkannt"; setConvReady(false); return; }
    cvOut.width = prev.width; cvOut.height = prev.height; gx.drawImage(prev, 0, 0);
    $("#convInfo").textContent = "";
    setConvReady(true);
  }, 60);
}
function setConvReady(on) { $("#convDownload").disabled = $("#convUse").disabled = !on; }
function finalPng() { return extractInk(2400); }

$("#cThr").oninput = e => { conv.thr = +e.target.value; $("#oThr").textContent = Math.round(conv.thr * 200) + " %"; processConv(); };
$("#cStr").oninput = e => { conv.str = +e.target.value; $("#oStr").textContent = conv.str.toFixed(2) + "×"; processConv(); };
$("#oThr").textContent = Math.round(conv.thr * 200) + " %"; $("#oStr").textContent = conv.str.toFixed(2) + "×";
$("#cFlat").onclick = e => { conv.flat = !conv.flat; e.currentTarget.setAttribute("aria-pressed", conv.flat); processConv(); };
document.querySelectorAll("#convMode button").forEach(b => b.onclick = () => {
  conv.mode = b.dataset.mode;
  document.querySelectorAll("#convMode button").forEach(x => x.setAttribute("aria-pressed", x === b));
  processConv();
});
$("#convDownload").onclick = () => finalPng()?.toBlob(b => downloadBlob(b, conv.name + ".png"), "image/png");
$("#convUse").onclick = () => {
  const out = finalPng(); if (!out) return;
  out.toBlob(b => {
    const id = "png-" + Date.now();
    DESIGNS.unshift({ id, name: conv.name.slice(0, 14), url: URL.createObjectURL(b), png: true });
    selectDesign(id);
    $("#convDlg").close();
    toast("Flash bereit");
  }, "image/png");
};

renderDesigns(); renderZones(); syncUI();
requestAnimationFrame(loop);
window.__tryon = { state, loadModels, loadConvFile, conv, masks, flow, flowStep, detect, twist, updateTwist, effRoll };
</script>
