<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stencit Studio</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  /* Stencit · Designsystem (design/basis.html)
     hell: Weiß und zartes Grau, weiches Glas ohne Ränder und ohne Schatten
     Rot (Marke) nur auf der Startseite und im Scan-Glow · Plus Jakarta Sans Regular · Carbon-Icons
     Raster 4/8 · Höhen 32 / 44 / 56 · alle Buttons rund · Leiste 56 = Button 44 + 2 × 6 (konzentrisch) */
  :root {
    --n-0: oklch(100% 0 0); --n-50: oklch(98.6% .002 75); --n-100: oklch(97% .003 75); --n-200: oklch(94.5% .003 75); --n-300: oklch(91% .004 75);
    --n-400: oklch(84% .004 75); --n-500: oklch(68% .005 75); --n-600: oklch(54% .005 75); --n-800: oklch(32% .004 75); --n-900: oklch(19% .003 75);
    --bordeaux: #730F26; --accent: #DB1A1D; --brand: linear-gradient(in srgb 180deg, #730F26, #DB1A1D);
    --bg: var(--n-100); --ink: var(--n-900); --text-2: var(--n-600); --text-3: var(--n-500); --muted: var(--n-500);
    --fill: oklch(19% .003 75 / .06); --fill-2: oklch(19% .003 75 / .1);
    --glass: oklch(26% .004 75 / .42); --glass-light: oklch(100% 0 0 / .66); --glass-strong: oklch(100% 0 0 / .84); --blur: blur(24px) saturate(1.6);
    --on-glass: oklch(100% 0 0); --on-glass-2: oklch(100% 0 0 / .62); --on-glass-fill: oklch(100% 0 0 / .12);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --h-sm: 32px; --h: 44px; --h-lg: 56px; --r-card: 32px; --r-inner: 20px; --r-full: 999px;
    --ease-out: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.4, .64, 1); --fast: 140ms; --med: 240ms;
    --red-2: var(--accent);
    --frame: oklch(17% .003 75); --frame-w: 6px;
    /* konzentrisch: Karte außen 42 → innen 36 (Rahmen 6) → Leiste 28 bei 8 Abstand → Buttons 22 bei 6 Innenabstand */
    --r-outer: 42px; --r-inner-card: calc(var(--r-outer) - var(--frame-w)); --inset: 8px;
    /* Glas-Knopf: fast durchsichtig, weißer Schein von innen (kein Rand, kein Schatten nach außen) */
    --gb: oklch(95.5% .003 75); --gb-hover: oklch(93% .003 75);
    --gb-glow: none;
    --gd: oklch(25% .003 75); --gd-hover: oklch(28.5% .003 75);
    --gd-glow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }  /* kein Doppeltipp-Zoom */
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; letter-spacing: -.011em;
    hyphens: auto; text-wrap: pretty; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  svg { flex: none; }
  .ic { width: 20px; height: 20px; fill: currentColor; }

  /* Hintergrund: einfach weiß */
  body { background: #fff; }
  .aura { display: none; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }

  /* ---------- Layout: Kopfzeile, darunter eine große Karte ---------- */
  .shell { height: 100vh; height: 100dvh; padding: 0 var(--s5) var(--s4); display: grid; grid-template-rows: 72px 1fr; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s1); }
  /* Laptop/Tablet: der Rahmen steht mittig im Querformat 4 : 3 (wie eine Webcam), mit Weiß drumherum */
  @media (min-width: 681px) and (min-height: 521px) { /* nicht im Handy-Querformat (zu wenig Höhe) */
    /* unten so viel Platz wie die Kopfzeile oben: der Rahmen sitzt genau in der Mitte des Fensters */
    .shell { padding-bottom: 72px; grid-template-rows: 72px minmax(0, 1fr); }
    main.card { justify-self: center; align-self: center; width: min(calc((100dvh - 144px) * .92 * 4 / 3), 100%, 1040px); height: auto; aspect-ratio: 4 / 3; }
  }
  .brand { display: inline-flex; color: var(--ink); }
  .brand .logo { height: 18px; width: auto; display: block; }
  .steps { height: 40px; padding: 0 var(--s4); display: inline-flex; align-items: center; border-radius: var(--r-full); font-size: 13px; background: var(--gb); box-shadow: var(--gb-glow); }
  .step { display: none; align-items: center; gap: var(--s2); }
  .step.on { display: inline-flex; }
  .step::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .step span { order: 1; }
  .step i { order: 2; font-style: normal; color: var(--text-3); }
  .step i::after { content: " / 4"; }

  /* die Karte hat einen dunklen Rahmen wie ein Gerät; die Insel oben wächst aus diesem Rahmen */
  .card { position: relative; min-height: 0; overflow: hidden; color: var(--ink); background: oklch(15% .003 75); border-radius: var(--r-outer); border: var(--frame-w) solid var(--frame); }
  .stage { position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center; touch-action: none; }
  #viewWrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #view { display: block; position: relative; }
  #overlay { position: absolute; pointer-events: none; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: oklch(15% .003 75); }
  #cam.mirror { transform: scaleX(-1); }
  .shot { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
  .shot.go { animation: shot .45s ease-out; }
  @keyframes shot { 0% { opacity: .85; } 100% { opacity: 0; } }
  .shutter { width: var(--h-lg); height: var(--h-lg); border-radius: 50%; padding: 5px; background: var(--fill-2); }
  .shutter::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--n-900); transition: transform .25s var(--spring); }
  .shutter:active::after { transform: scale(.86); }
  .screen-flash { position: fixed; inset: 0; z-index: 100; background: #fff; pointer-events: none; animation: fade .12s ease-out; }


  /* ---------- Startseite (leere Karte) ---------- */
  /* ---------- Startframe: die Kamera-Oberfläche steht schon (Auslöser, Blitz, Galerie, Wenden), dahinter ein
     etwas helleres Schwarz als der Rahmen. Nach der ersten Freigabe startet die Kamera direkt. ---------- */
  .drop { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; background: oklch(19.5% .003 75); color: #fff; transition: background-color .3s; }
  .drop.over { background: oklch(23% .003 75); }
  .drop img { max-width: 46%; max-height: 38%; margin-bottom: 48px; object-fit: contain; rotate: -5deg; animation: try-in .7s var(--spring) both; }
  @keyframes try-in { from { transform: translateY(14px) scale(.6) rotate(8deg); opacity: 0; } }
  .try-x { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: oklch(100% 0 0 / .1); color: #fff; }
  .try-x .ic { width: 13px; height: 13px; }
  /* Kamera: das Motiv halbtransparent in der Mitte, damit man die Stelle anpeilen kann */
  .cam-ghost { position: absolute; left: 50%; top: 46%; width: 44%; max-height: 44%; object-fit: contain; translate: -50% -50%; opacity: .5; pointer-events: none; z-index: 2;
    animation: fade .4s var(--ease-out); }
  /* weicher Wechsel aus den Flashes ins Studio (die Seite lädt dabei frisch) */
  .shell { transition: opacity .28s var(--ease-out), scale .28s var(--ease-out); }
  body.leaving .shell { opacity: 0; scale: .985; }

  /* ---------- Buttons: rund, flächig, ohne Rand und Schatten ---------- */
  .btn { height: var(--h); padding: 0 var(--s5); border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    font-size: 15px; white-space: nowrap; text-box: trim-both cap alphabetic; }
  .btn, .chip, .thumb, .seg button, .views button { transition: transform .38s var(--spring), background-color var(--fast) var(--ease-out), color var(--fast) var(--ease-out), opacity var(--fast); }
  .btn:active, .chip:active, .thumb:active, .seg button:active, .views button:active { transform: scale(.94); transition-duration: 80ms; transition-timing-function: var(--ease-out); }
  .btn .ic { margin-left: -4px; }
  .btn.lg { height: var(--h-lg); padding: 0 var(--s6); font-size: 16px; }
  .btn.icon { width: var(--h); padding: 0; }
  .btn.icon .ic { margin: 0; }
  .btn.icon, .thumb, .views button { position: relative; }
  .btn.icon::after, .thumb::after, .views button::after { content: ""; position: absolute; inset: -4px; }  /* größere Trefferfläche */
  .btn.primary { background: var(--n-900); color: var(--n-0); }
  .btn.primary:hover { background: var(--n-800); }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.accent:hover { background: oklch(52% .2 27); }
  .btn.soft { background: var(--fill); }
  .btn.soft:hover { background: var(--fill-2); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.ghost:hover { background: var(--fill); }
  .btn.ghost[aria-pressed="true"] { background: var(--n-900); color: var(--n-0); }
  .btn.lg.soft.icon, .btn.lg.icon { width: var(--h-lg); }
  .btn:disabled { opacity: .35; cursor: default; }

  /* Leiste: eine Glaskapsel unten in der Karte */
  .panel { display: flex; align-items: center; justify-content: space-between; gap: var(--s1); flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: var(--s1); min-width: 0; }
  .card > .panel { position: absolute; z-index: 5; left: 50%; bottom: var(--inset); transform: translateX(-50%); flex-wrap: nowrap; max-width: calc(100% - 2 * var(--inset));
    min-height: var(--h-lg); padding: 6px; gap: var(--s2); border-radius: var(--r-full); background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .card > .panel:not([hidden]) { animation: dock-in .5s var(--spring) both; }
  .card > .panel:not([hidden]) .group > * { animation: item-in .45s var(--spring) both; }
  .card > .panel .group > :nth-child(2) { animation-delay: 30ms; } .card > .panel .group > :nth-child(3) { animation-delay: 60ms; }
  .card > .panel .group + .group > :nth-child(1) { animation-delay: 60ms; } .card > .panel .group + .group > :nth-child(2) { animation-delay: 90ms; }
  @keyframes dock-in { from { translate: 0 24px; scale: .96; opacity: 0; } }
  @keyframes item-in { from { translate: 0 6px; opacity: 0; } }
  .swap { animation: swap .32s var(--ease-out); }
  @keyframes swap { from { filter: blur(4px); opacity: 0; translate: 0 3px; } }
  @media (prefers-reduced-motion: reduce) { .card > .panel, .card > .panel .group > *, .swap, .thumb.pop { animation: none !important; } }
  /* Kamera (Layout C): nur zwei Größen – alle Knöpfe 48, der Auslöser 72. Unten auf einer Linie:
     Stencil-Karte | runder Auslöser genau mittig | Galerie, gleicher Abstand zum Rand.
     Rechts über der Galerie, in derselben Spalte: Blitz und Kamera wechseln untereinander. */
  #panelCam { --cam-pad: 16px; left: 0; right: 0; bottom: 18px; width: auto; max-width: none; transform: none; padding: 0 var(--cam-pad); background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 0; }
  #panelCam .group { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0; }
  #panelCam .group > :first-child { justify-self: start; } #panelCam .group > :last-child { justify-self: end; }
  #panelCam .shutter { width: 72px; height: 72px; padding: 5px; border-radius: 50%; background: none; box-shadow: inset 0 0 0 3px #fff; transition: transform .3s var(--spring); }
  #panelCam .shutter::after { display: block; background: #fff; }
  #panelCam .shutter:active { transform: scale(.94); }
  .cam-sq, .cam-card { position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--gd); color: #fff; transition: background-color .2s, transform .3s var(--spring); }
  .cam-sq .ic, .cam-card .ic { width: 18px; height: 18px; } .cam-sq:active, .cam-card:active { transform: scale(.93); }
  @media (hover: hover) { .cam-sq:hover, .cam-card:hover { background: var(--gd-hover); } }
  .cam-card img { display: none; width: 34px; height: 34px; object-fit: contain; } .cam-card.has img { display: block; } .cam-card.has .ic { display: none; }
  .cam-cardwrap { position: relative; display: inline-grid; }
  .cam-cardwrap .try-x { position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; background: var(--frame); }
  .cam-cardwrap .try-x .ic { width: 10px; height: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cam-side { position: absolute; z-index: 5; right: 16px; bottom: calc(18px + 36px + 24px + 10px); display: none; flex-direction: column; gap: 10px; }
  .card:has(#panelCam:not([hidden])) .cam-side { display: flex; }
  .cs { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--gd); color: #fff; transition: background-color .2s, transform .3s var(--spring); animation: item-in .45s var(--spring) both; }
  .cs + .cs { animation-delay: 40ms; } .cs .ic { width: 18px; height: 18px; } .cs:active { transform: scale(.92); }
  .cs[aria-pressed="true"] { background: oklch(84% .2 115); color: var(--ink); }

  /* Motive: runde Sticker-Kreise */
  .thumbs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; max-width: 40vw; padding: 4px; margin: -4px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 4px, #000 calc(100% - 12px), transparent); mask-image: linear-gradient(90deg, transparent, #000 4px, #000 calc(100% - 12px), transparent); }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb { flex: none; width: var(--h); height: var(--h); border-radius: 50%; background: var(--fill); display: grid; place-items: center; overflow: hidden; }
  .thumb img { max-width: 78%; max-height: 78%; }
  .thumb[aria-pressed="true"] { background: var(--n-0); }
  .thumb.add { color: var(--ink); background: transparent; }
  .thumb.add:hover { background: var(--fill); }
  .thumb.pop { animation: pop .5s var(--spring); }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* Chip: Schalter als Fläche, an = schwarz */
  .chip { flex: none; white-space: nowrap; height: var(--h); padding: 0 var(--s4); border-radius: var(--r-full); display: inline-flex; align-items: center; gap: var(--s2); font-size: 14px; background: var(--fill); color: var(--text-2); }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--n-900); color: var(--n-0); }

  /* ---------- Overlays auf dem Foto: weißes Glas ---------- */
  .status, .info { position: absolute; z-index: 4; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); color: var(--ink); }
  .status { top: calc(48px + var(--s2)); left: 50%; transform: translateX(-50%); height: var(--h-sm); padding: 0 var(--s4); border-radius: var(--r-full); display: inline-flex; align-items: center; gap: var(--s2); font-size: 13px; white-space: nowrap; text-box: trim-both cap alphabetic; }
  /* Hinweise kommen aus der Insel: schwarz, weiße Schrift, ploppen bei jedem neuen Text heraus */
  .stage > .status { top: calc(48px + 6px); height: 36px; padding: 0 16px 0 14px; background: var(--frame); color: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; transform-origin: 50% -26px; }
  .stage > .status.pop { animation: toast-plop .55s var(--spring) both; }
  @keyframes toast-plop { 0% { opacity: 0; transform: translate(-50%, -24px) scale(.36, .18); } 40% { opacity: 1; } 100% { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) { .stage > .status.pop { animation: none; } }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .status[data-s="busy"] .dot { background: var(--accent); animation: blink .9s infinite; }
  .status[data-s="err"] .dot { background: oklch(75% .16 70); }
  @keyframes blink { 50% { opacity: .25; } }
  /* ---------- Insel: kommt aus dem Rahmen oben, zeigt erst die Analyse, wird dann zum Ebenen-Umschalter ---------- */
  /* feste Größe (220 × 48), damit wechselnder Inhalt nichts verschiebt; nur die Zusammenfassung klappt groß auf */
  .island { position: absolute; z-index: 6; top: 0; left: 50%; width: 220px; height: 48px; color: #fff; background: var(--frame);
    border-radius: 0 0 24px 24px; translate: -50% -110%; transition: translate .6s var(--spring), width .5s var(--spring), height .5s var(--spring), border-radius .5s var(--spring); }
  .island[data-mode="status"], .island[data-mode="size"], .island[data-mode="summary"] { translate: -50% 0; }
  /* weiche Hohlkehlen links und rechts, damit die Insel aus dem Rahmen fließt */
  .island::before, .island::after { content: ""; position: absolute; top: 0; width: 16px; height: 16px; }
  .island::before { right: 100%; background: radial-gradient(circle at 0 100%, transparent 15.5px, var(--frame) 16px); }
  .island::after { left: 100%; background: radial-gradient(circle at 100% 100%, transparent 15.5px, var(--frame) 16px); }
  .island > div { position: absolute; left: 50%; top: 0; height: 100%; translate: -50% 0; display: flex; align-items: center; white-space: nowrap;
    opacity: 0; filter: blur(4px); transition: opacity .25s var(--ease-out), filter .25s var(--ease-out); pointer-events: none; }
  .island[data-mode="status"] .isl-status, .island[data-mode="size"] .isl-size, .island[data-mode="summary"] .isl-sum { opacity: 1; filter: none; pointer-events: auto; transition-delay: .12s; }
  .isl-status > span, .isl-size { max-width: 196px; overflow: hidden; text-overflow: ellipsis; }
  /* Zusammenfassung: Kopfzeile ist ein Knopf, darunter klappt der Inhalt auf */
  .island > .isl-sum { left: 0; right: 0; translate: none; }
  .isl-sum-head { width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
  .isl-sum-head .ic { width: 16px; height: 16px; padding: 4px; box-sizing: content-box; border-radius: 50%; background: oklch(100% 0 0 / .09); transition: rotate .4s var(--spring); }
  .island[data-open="true"] .isl-sum-head .ic { rotate: 180deg; }

  /* Zusammenfassung: eine eigene schwarze Karte, die mit einem „Plop“ aus der Insel wächst.
     Volle Breite mit 8 px Abstand zum Rahmen, Ecken konzentrisch (36 − 8 = 28). */
  .sumcard { position: absolute; z-index: 7; left: var(--inset); right: var(--inset); top: calc(48px + var(--s2)); max-height: calc(100% - 48px - var(--s2) - var(--h-lg) - 2 * var(--inset));
    overflow: auto; overscroll-behavior: contain; scrollbar-width: none; border-radius: calc(var(--r-inner-card) - var(--inset)); background: var(--frame); color: #fff;
    transform-origin: 50% -56px; }
  .sumcard::-webkit-scrollbar { display: none; }
  .sumcard.in { animation: plop .62s var(--spring) both; }
  .sumcard.out { animation: plop-out .28s var(--ease-out) both; }
  @keyframes plop { 0% { opacity: 0; transform: translateY(-40px) scale(.32, .08); border-radius: 40px; } 45% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes plop-out { to { opacity: 0; transform: translateY(-36px) scale(.4, .1); } }
  .sumcard > * { animation: sum-item .5s var(--ease-out) both; animation-delay: .18s; }
  @keyframes sum-item { from { opacity: 0; translate: 0 6px; } }
  @media (prefers-reduced-motion: reduce) { .sumcard.in, .sumcard.out, .sumcard > * { animation: none; } }
  /* zwei Größen: 28 für die Größe, sonst überall 14; Hierarchie nur über Weiß und Grau */
  .sum-body { padding: 22px 22px 20px; display: grid; gap: 18px; font-size: 14px; line-height: 1.35; }
  .sum-body .dim { color: oklch(100% 0 0 / .5); }
  .sum-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 2px 2px 4px; }
  .sum-size { font-size: 28px; line-height: 1.05; letter-spacing: -.04em; margin-bottom: 4px; }
  .sum-x { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: oklch(100% 0 0 / .08); }
  .sum-x .ic { width: 16px; height: 16px; }
  .needles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .needles li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px; }
  .nname { display: flex; align-items: baseline; gap: 12px; }
  .nname > :first-child { min-width: 44px; }
  .nic { width: 28px; height: 28px; display: grid; place-items: center; }
  .nic svg { width: 28px; height: 28px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatches span { height: 32px; padding: 0 12px 0 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; background: oklch(100% 0 0 / .07); }
  .swatches i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px oklch(100% 0 0 / .25); }
  .sum-scale { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sum-scale input { width: 56px; height: 32px; border: 0; border-radius: 999px; background: oklch(100% 0 0 / .08); color: #fff; text-align: center; font-size: 14px; }
  .isl-size { padding: 0 24px; font-size: 15px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .isl-status { gap: 10px; padding: 0 22px 0 18px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .isl-status[data-s="err"] { color: oklch(85% .12 70); }
  .isl-status .loader { position: relative; left: auto; top: auto; width: 18px; height: 18px; opacity: 1; z-index: auto; }
  .isl-status .loader i, .isl-status .loader b { left: 9px; top: 9px; width: 3px; height: 3px; margin: -1.5px; }
  .isl-status .loader i { transform: rotate(calc(var(--k) * 45deg - 90deg)) translateX(7px); }
  .isl-status .loader b { width: 3px; height: 3px; }
  .isl-status:not([data-s="busy"]) .loader { display: none; }
  .isl-status:not([data-s="busy"]) { padding-left: 22px; }
  .views { display: flex; gap: 2px; }
  .views button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: oklch(100% 0 0 / .8); background: var(--gd); box-shadow: var(--gd-glow); }
  .views button .ic { width: 18px; height: 18px; }
  .views button:hover { color: #fff; background: oklch(100% 0 0 / .2); }
  .views button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .island, .island > div { transition: none; } }
  .info { right: var(--s3); top: var(--s3); width: 260px; border-radius: calc(var(--r-inner-card) - var(--s3)); overflow: hidden; font-size: 13px; }
  .info-head { width: 100%; height: var(--h); padding: 0 var(--s3) 0 var(--s4); display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .info-head .ic { width: 16px; height: 16px; color: var(--text-3); transition: transform var(--med) var(--ease-out); }
  .info[data-open="true"] .info-head .ic { transform: rotate(180deg); }
  .info-body { display: none; padding: 0 var(--s4) var(--s4); }
  .info[data-open="true"] .info-body { display: grid; animation: swap .3s var(--ease-out); }
  .info dl { display: grid; grid-template-columns: auto 1fr; margin: 0; row-gap: var(--s2); }
  .info dt, .info dd { margin: 0; }
  .info dt { color: var(--text-2); padding-right: var(--s3); }
  .info dd { text-align: right; }
  .info dd small { display: block; color: var(--text-3); font-size: 12px; }
  .info .note { margin-top: var(--s3); color: var(--text-3); font-size: 12px; line-height: 1.45; }
  .info .scale-edit { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); }
  .info .scale-edit input { width: 64px; height: var(--h-sm); border: 0; border-radius: var(--r-full); background: var(--fill); text-align: center; }
  .info .link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--n-400); }


  /* auf dem Foto: rauchiges Glas, Inhalt weiß; Hauptaktion = weiße Pille */
  .card > .panel, .stage > .status, .info { color: var(--on-glass); }
  .card > .panel .btn.ghost { color: var(--on-glass); background: var(--gd); box-shadow: var(--gd-glow); }
  .card > .panel .btn.ghost:hover { background: var(--gd-hover); }
  .card > .panel .btn.icon .ic { width: 18px; height: 18px; }
  .card > .panel .btn.ghost[aria-pressed="true"] { background: var(--on-glass); color: var(--ink); }
  .card > .panel .btn.primary { background: var(--on-glass); color: var(--ink); }
  .card > .panel .btn.primary:hover { background: var(--n-200); }
  .card > .panel .thumb { background: var(--on-glass-fill); }
  .card > .panel .thumb[aria-pressed="true"] { background: var(--on-glass); }
  .card > .panel .thumb.add { background: var(--on-glass-fill); color: var(--on-glass); }
  .card > .panel .thumb.add:hover { background: var(--on-glass-fill); }

  .stage > .status .dot { background: var(--on-glass); }
  .stage > .status[data-s="busy"] .dot { background: var(--accent); }
  .info-head .ic, .info dd small, .info .note { color: var(--on-glass-2); }
  .info dt { color: var(--on-glass-2); }
  .info .scale-edit input { background: var(--on-glass-fill); color: var(--on-glass); }
  .info .link { color: var(--on-glass); text-decoration-color: var(--on-glass-2); }

  /* Platzieren: unten links die Motiv-Kachel, direkt daneben die Leiste; alles Glas, Ecken konzentrisch zum Rahmen (36 − 8 = 28) */
  #panelPlace { left: var(--inset); right: var(--inset); transform: none; max-width: none; min-height: 0; padding: 0; gap: var(--s2); background: none;
    backdrop-filter: none; -webkit-backdrop-filter: none; align-items: flex-end; justify-content: flex-start; pointer-events: none; }
  #panelPlace > * { pointer-events: auto; }
  .motifs { position: relative; flex: none; }
  .motif-card { position: relative; display: block; width: 96px; height: 96px; padding: 6px; border-radius: calc(var(--r-inner-card) - var(--inset));
    background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: transform .38s var(--spring); }
  .motif-card:active { transform: scale(.95); }
  .motif-card .pic { width: 100%; height: 100%; display: grid; place-items: center; border-radius: calc(var(--r-inner-card) - var(--inset) - 6px); background: oklch(100% 0 0 / .5); }
  .motif-card img { max-width: 74%; max-height: 74%; }
  .motif-card .badge { position: absolute; right: -4px; top: -4px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--n-0); color: var(--ink); }
  .motif-card .badge .ic { width: 14px; height: 14px; }
  /* Auswahl: klappt über der Kachel auf */
  .tray { position: absolute; left: 0; bottom: calc(100% + var(--s2)); padding: 6px; border-radius: 28px; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    animation: tray-in .35s var(--spring); }
  @keyframes tray-in { from { opacity: 0; translate: 0 8px; scale: .96; } }
  .tray .thumbs { max-width: min(60vw, 420px); margin: 0; padding: 0; gap: 4px; -webkit-mask-image: none; mask-image: none; }
  .tools { display: flex; align-items: center; gap: 4px; height: var(--h-lg); padding: 6px; border-radius: 28px; background: var(--glass); color: var(--on-glass);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .tools .views { gap: 4px; padding-right: 4px; margin-right: 2px; }
  .tools .views button { width: 44px; height: 44px; }
  .btn.soft-on { padding: 0 18px; background: var(--on-glass-fill); color: var(--on-glass); }
  .btn.soft-on:hover { background: oklch(100% 0 0 / .2); }
  .tools .btn.primary { background: var(--on-glass); color: var(--ink); padding: 0 20px; }
  .tools .btn.primary:hover { background: var(--n-200); }

  /* ---------- Menü unten: Studio | Flashes (Desktop rechts, Handy mittig wie eine App-Leiste) ---------- */
  /* Menü: kleine helle Kapsel oben rechts, nur Icons; das aktive weiß mit Punkt darunter */
  .top-r { display: flex; align-items: center; gap: var(--s2); }
  .tabbar { display: flex; gap: 2px; padding: 4px; border-radius: var(--r-full); background: var(--gb); box-shadow: var(--gb-glow); }
  .tabbar button { position: relative; width: 52px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--text-3); transition: color .2s, background-color .2s; }
  .tabbar button .ic { width: 17px; height: 17px; }
  .tabbar button:hover { color: var(--ink); }
  .tabbar button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .tabbar button[aria-pressed="true"]::after { content: ""; position: absolute; bottom: 3px; width: 3px; height: 3px; border-radius: 50%; background: var(--ink); }
  body:has(.shell[data-tab="flashes"]) .tabbar button[aria-pressed="true"] { background: oklch(19% .003 75 / .07); box-shadow: none; }
  .shell[data-tab="flashes"] .steps { visibility: hidden; }

  /* ---------- Flashes: eigene Seite, eine helle Galerie. Nur die ausgeschnittenen Motive, groß, auf Weiß ---------- */
  body:has(.shell[data-tab="flashes"]) { background: #fff; }
  body:has(.shell[data-tab="flashes"]) .aura { display: none; }
  .fl-tools { display: none; gap: 6px; }
  .shell[data-tab="flashes"] .fl-tools { display: flex; }
  .shell[data-tab="flashes"] .steps { display: none; }
  .rb { position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--gb); box-shadow: var(--gb-glow); color: var(--ink); transition: transform .3s var(--spring), background-color .2s; }
  .rb:hover { background: var(--gb-hover); }
  .rb:active { transform: scale(.92); }
  .rb.main { background: var(--n-900); color: #fff; }
  .rb[aria-pressed="true"] { background: oklch(19% .003 75 / .16); color: var(--ink); } /* aktiv, aber ruhiger als der schwarze Haupt-Knopf */
  .rb .ic { width: 17px; height: 17px; }
  .rb .badge { position: absolute; right: -2px; top: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: var(--n-900); color: #fff; }
  /* Flashes sind ein Canvas: ziehen zum Verschieben, zwei Finger oder Strg+Scrollen zum Zoomen, Motive mit der Maus/dem Finger verschieben */
  .flashes { position: relative; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .flashes.panning { cursor: grabbing; }
  .fl-board { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  /* Collage: Positionen und Drehung kommen aus collage.js */
  .fl-grid { position: relative; min-height: 40px; }
  .fl-tile { position: absolute; display: grid; place-items: center; cursor: pointer; transform: rotate(var(--r, 0deg)); animation: pop .5s var(--spring) both; transition: transform .45s var(--spring), opacity .25s; }
  @media (hover: hover) { .fl-tile:hover { transform: rotate(var(--r, 0deg)) translateY(-4px) scale(1.02); } }
  .fl-tile:active { transform: rotate(var(--r, 0deg)) scale(.96); }
  .fl-tile.dragging { z-index: 5; transition: none; transform: rotate(var(--r, 0deg)) scale(1.05); filter: drop-shadow(0 18px 24px oklch(0% 0 0 / .12)); cursor: grabbing; }
  .fl-tile img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .fl-tile .chk { position: absolute; right: 6%; top: 6%; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: transparent; }
  .fl-tile .chk .ic { width: 15px; height: 15px; }
  .flashes:not(.selecting) .fl-tile .chk { display: none; }
  .fl-tile[aria-pressed="true"] .chk { background: var(--n-900); color: #fff; }
  .flashes.selecting .fl-tile:not([aria-pressed="true"]) { opacity: .4; }
  .fl-empty { min-height: 60%; display: grid; place-items: center; align-content: center; gap: 16px; text-align: center; color: var(--text-3); }
  .fl-empty .rb { width: 56px; height: 56px; }
  .fl-empty .rb .ic { width: 22px; height: 22px; }
  .fl-busy { position: fixed; left: 50%; top: 84px; translate: -50% 0; z-index: 12; height: 36px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; background: var(--n-900); color: #fff; animation: dock-in .4s var(--spring) both; }
  /* Auswahl-Leiste unten */
  /* Auswahl: kompakte helle Kapsel unten mittig, Ecken konzentrisch (Kapsel 26 = Knopf 20 + 6) */
  .fl-dock { position: fixed; left: 50%; bottom: max(var(--s4), env(safe-area-inset-bottom)); translate: -50% 0; z-index: 9; display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 6px; border-radius: 26px; background: oklch(95% .003 75 / .92); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    color: var(--ink); font-size: 14px; white-space: nowrap; animation: dock-in .45s var(--spring) both; }
  .fl-dock .rb { width: 40px; height: 40px; background: oklch(19% .003 75 / .07); }
  .fl-dock .fl-all { height: 40px; padding: 0 14px; border-radius: 20px; background: oklch(19% .003 75 / .07); font-size: 14px; }
  .fl-selbtn { height: 48px; padding: 0 18px 0 14px; border-radius: var(--r-full); display: inline-flex; align-items: center; gap: 8px; background: var(--gb); color: var(--ink); font-size: 14px; transition: background-color .2s, transform .3s var(--spring); }
  .fl-selbtn .ic { width: 16px; height: 16px; } .fl-selbtn:active { transform: scale(.95); }
  .fl-selbtn[aria-pressed="true"] { background: var(--n-900); color: #fff; }
  .fl-selbtn { white-space: nowrap; hyphens: none; }
  @media (max-width: 680px) { .fl-selbtn { height: 42px; padding: 0 14px; } .fl-selbtn .ic { display: none; } }
  .fl-dock #flSelInfo { min-width: 88px; text-align: center; color: var(--text-2); }
  .fl-dock .btn.primary { height: 40px; padding: 0 18px; background: var(--n-900); color: #fff; }
  .fl-dock .btn.primary:disabled { opacity: .35; }
  /* Großansicht eines Flashes: weiß, das Motiv groß, darunter runde Knöpfe */
  .fl-view { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: 1fr auto; gap: 20px; padding: 32px 24px max(24px, env(safe-area-inset-bottom)); background: #fff; animation: fade .25s var(--ease-out); }
  .fl-view .big { position: relative; min-height: 0; margin-bottom: -28px; } /* Knöpfe dürfen leicht über dem Stencil liegen */
  .fl-view .big img { position: absolute; inset: 0; margin: auto; max-width: min(100%, 760px); max-height: 100%; object-fit: contain; animation: pop .5s var(--spring); }
  .fl-view .bar { position: relative; z-index: 1; }
  .fl-view .bar { justify-self: center; width: min(100%, 360px); display: grid; gap: 10px; }
  .fl-view .bar .icons { display: flex; justify-content: center; gap: 10px; }
  .fl-view .bar .rb { width: 52px; height: 52px; }
  .fl-view .bar .rb .ic { width: 20px; height: 20px; }
  .fl-view .bar .pill { width: 100%; height: 56px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--n-900); color: #fff; font-size: 16px; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  @keyframes fade { from { opacity: 0; } }
  /* Dialoge (Teilen, Links): dunkle Karte unten in der Mitte */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: oklch(0% 0 0 / .35); animation: fade .25s var(--ease-out); }
  .sheet { position: fixed; z-index: 31; left: 50%; bottom: max(var(--s4), env(safe-area-inset-bottom)); translate: -50% 0; width: min(460px, calc(100% - 2 * var(--s2))); max-height: calc(100% - 32px); overflow: auto;
    padding: 22px; border-radius: 30px; background: var(--frame); color: #fff; display: grid; gap: 18px; font-size: 14px; animation: sheet-in .5s var(--spring) both; }
  .sheet > * { min-width: 0; }
  @keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { margin: 0; font-weight: 400; font-size: 22px; letter-spacing: -.03em; }
  .sheet .dim { color: oklch(100% 0 0 / .5); }
  .sheet .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sheet .stack { display: grid; gap: 6px; }
  .opt { height: 40px; padding: 0 16px; border-radius: var(--r-full); background: oklch(100% 0 0 / .07); color: oklch(100% 0 0 / .75); font-size: 14px; }
  .opt[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .sheet textarea { width: 100%; min-height: 64px; resize: none; padding: 12px 16px; border: 0; border-radius: 20px; background: oklch(100% 0 0 / .07); color: #fff; font: inherit; }
  .sheet textarea::placeholder { color: oklch(100% 0 0 / .4); }
  .sheet .btn.primary { background: #fff; color: var(--ink); }
  .sheet .btn.ghost { background: oklch(100% 0 0 / .08); color: #fff; }
  .sheet .wide { width: 100%; }
  /* Laufzeit-Slider: dunkle Spur mit Rasterpunkten, heller Verlauf bis zum Knopf, Knopf = Stencit-Zeichen im Kreis */
  .ttl { display: grid; gap: 10px; }
  .ttl-head { display: flex; align-items: baseline; gap: 10px; font-size: 16px; }
  .ttl-head b { font-weight: 400; }
  .ttl-ends { display: flex; justify-content: space-between; font-size: 13px; color: oklch(100% 0 0 / .45); }
  .ttl-track { --p: .33; position: relative; isolation: isolate; height: 48px; border-radius: 24px; background: oklch(100% 0 0 / .07); touch-action: none; cursor: pointer; outline: none; }
  .ttl-track:focus-visible { box-shadow: 0 0 0 2px oklch(100% 0 0 / .5); }
  /* Spur in den Markenfarben: weicher Verlauf, der mit dem Ziehen kräftiger und heller wird
     (Bordeaux bei kurzer Laufzeit → helles Rot bei unbegrenzt). Kein Schein nach außen, nur ein leichter am Ende. */
  .ttl-track .fill { --end: color-mix(in oklch, #DB1A1D calc(var(--p) * 100%), #730F26); --tip: color-mix(in oklch, oklch(68% .2 28) calc(var(--p) * 100%), #DB1A1D);
    position: absolute; left: 0; top: 0; bottom: 0; width: calc(24px + var(--p) * (100% - 48px) + 24px); border-radius: 24px;
    background: linear-gradient(90deg, transparent, var(--end) 75%, var(--tip)); opacity: calc(.55 + .45 * var(--p));
    transition: width .45s var(--spring), opacity .3s; }
  /* Glow nur an der Spitze (am Knopf), nicht entlang der grauen Spur; wird nach rechts stärker */
  .ttl-track .fill::after { content: ""; position: absolute; right: -6px; top: 50%; width: calc(40px + 28px * var(--p)); aspect-ratio: 1; translate: 0 -50%; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklch, var(--tip) calc(var(--p) * 55%), transparent), transparent 68%); pointer-events: none; }
  .ttl-track .dot { z-index: 1; position: absolute; top: 50%; left: calc(24px + var(--p) * (100% - 48px)); width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: oklch(100% 0 0 / .35); }
  .ttl-track .knob { z-index: 2; position: absolute; top: 4px; left: calc(var(--p) * (100% - 48px) + 4px); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: var(--ink); transition: left .4s var(--spring), transform .25s var(--spring); }
  .ttl-track.drag .knob { transition: transform .25s var(--spring); transform: scale(1.08); }
  .ttl-track.drag .fill { transition: none; }
  .ttl-track .knob .ic { width: 20px; height: 20px; }
  /* Schalter (An/Aus): Text links, rechts ein Schalter wie in iOS. An = Knopf rechts, Spur Lime → Gelb */
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 22px; background: var(--fill); text-align: left; color: inherit; }
  .sw .t { display: grid; } .sw small { font-size: 12px; opacity: .5; }
  .sw .track { flex: none; position: relative; width: 50px; height: 30px; border-radius: 15px; background: oklch(19% .003 75 / .14); transition: background-color .25s var(--ease-out); }
  .sw .track::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, oklch(73% .25 138), oklch(85% .23 115)); opacity: 0; /* grelles, „bratty“ Neon-Lime */ transition: opacity .25s var(--ease-out); }
  .sw .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .35s var(--spring), background-color .25s; }
  .sw[aria-checked="true"] .track::before { opacity: 1; }
  .sw[aria-checked="true"] .track::after { transform: translateX(20px); } /* heller Knopf auf sattem Lime-Grün: genug Kontrast */
  .sheet .sw { background: oklch(100% 0 0 / .07); }
  .sheet .sw .track { background: oklch(100% 0 0 / .16); }
  .linkbox { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border-radius: 20px; background: oklch(100% 0 0 / .07); }
  .linkbox code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit; color: oklch(100% 0 0 / .8); }
  /* Profil im Teilen-Dialog: Profilbild + Name erscheinen als Tag an den geteilten Stencils */
  .prof { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 22px; background: oklch(100% 0 0 / .07); text-align: left; width: 100%; }
  .prof .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: oklch(100% 0 0 / .12); font-size: 15px; }
  .prof .av img { width: 100%; height: 100%; object-fit: cover; }
  .prof .t { display: grid; flex: 1; min-width: 0; } .prof small { font-size: 12px; opacity: .5; }
  .prof input { width: 100%; min-width: 0; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: oklch(100% 0 0 / .08); color: #fff; font: inherit; }
  .prof input::placeholder { color: oklch(100% 0 0 / .4); }
  .sec-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: oklch(100% 0 0 / .5); }
  .sec-note .ic { width: 14px; height: 14px; margin-top: 2px; }
  .fl-links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .fl-links li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
  .fl-links .acts { display: flex; gap: 4px; }
  .ib-dark { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: oklch(100% 0 0 / .08); color: #fff; }
  .ib-dark:hover { background: oklch(100% 0 0 / .14); }
  .ib-dark .ic { width: 16px; height: 16px; }
  .needle { position: absolute; z-index: 4; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: radial-gradient(circle, #ff6a5a, #DB1A1D 70%);
    box-shadow: 0 0 0 3px oklch(56.8% .221 27.7 / .28), 0 0 0 8px oklch(56.8% .221 27.7 / .1), 0 0 14px 2px oklch(56.8% .221 27.7 / .35); pointer-events: none; }
  .compare { position: absolute; z-index: 3; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; cursor: ew-resize; pointer-events: auto; }
  .compare::after { content: ""; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: #fff; }

  /* ---------- Stencil-Editor ---------- */
  /* scrollbar, falls der Editor höher ist als der Bildschirm (iPhone mit Safari-Leisten) */
  .cut { position: fixed; inset: 0; z-index: 20; display: grid; place-items: safe center; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: max(var(--s4), env(safe-area-inset-top)) var(--s4) max(var(--s4), env(safe-area-inset-bottom)); background: oklch(97% .003 75 / .6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .cutbox { width: min(940px, 100%); display: grid; gap: var(--s2); padding: var(--s2); color: var(--ink); background: var(--n-0); border-radius: var(--r-card); }
  .cutstage { position: relative; overflow: hidden; border-radius: calc(var(--r-card) - var(--s2)); height: min(68vh, 680px); height: min(64dvh, 680px); touch-action: none;
    background: var(--n-100) radial-gradient(circle at center, oklch(19% .003 75 / .09) 1px, transparent 1.4px) 0 0 / 16px 16px; }
  #cutCanvas { position: absolute; left: 50%; top: 50%; display: block; touch-action: none; transform-origin: center; }
  /* Lupe: zeigt beim Zeichnen den Bereich unter Finger oder Maus vergrößert, mit Fadenkreuz */
  .loupe { position: absolute; z-index: 5; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; pointer-events: none; background: var(--n-100);
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px oklch(0% 0 0 / .12); }
  .cutstage .status { left: var(--s3); top: var(--s3); bottom: auto; transform: none; pointer-events: none; }
  .cuttools { position: absolute; z-index: 4; top: var(--s3); right: var(--s3); display: flex; gap: var(--s1); padding: 4px; border-radius: var(--r-full); background: var(--glass-light); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .cuttools .btn { width: 36px; height: 36px; background: var(--fill); }
  .cuttools .btn:hover { background: var(--fill); }
  .cutbox > .panel { padding: var(--s1); row-gap: var(--s2); }
  .looks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); padding: 0 var(--s1); }
  /* Schachbrett zeigt, dass der Hintergrund wirklich weg (durchsichtig) ist */
  .cut.no-bg .cutstage { background-color: #fff;
    background-image: conic-gradient(oklch(92% .003 75) 25%, transparent 0 50%, oklch(92% .003 75) 0 75%, transparent 0); background-size: 16px 16px; }
  .sec-title { padding: var(--s1) var(--s2) 0; font-size: 13px; color: var(--text-2); }
  .sec-title .dim { color: var(--text-3); margin-left: 6px; }
  .quickbar { display: none; justify-items: center; gap: 2px; padding: var(--s3) var(--s2) var(--s1); text-align: center; font-size: 15px; }
  .quickbar .dim { font-size: 13px; color: var(--text-3); }
  .sel-swatch { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: oklch(80% .24 135); box-shadow: 0 0 0 2px oklch(19% .003 75 / .15); }
  .cutbox > .sw.cut-bg { margin: 0 var(--s1); }
  /* Schnellansicht: nur Ergebnis + Anpassen/Übernehmen; Werkzeuge erst nach „Anpassen“ */
  .cut.quick .quickbar { display: grid; }
  .cut.quick .looks, .cut.quick .sec-title, .cut.quick .panel:has(#cutTools) .group:first-child, .cut.quick .cuttools, .cut.quick .cutstage .status { display: none; }
  .cut:not(.quick) #cutEdit { display: none; }
  .looks button { display: grid; justify-items: center; gap: 6px; padding: 6px 6px 8px; border-radius: 20px; font-size: 13px; color: var(--text-2); background: var(--fill); transition: background-color .2s, color .2s, transform .3s var(--spring); }
  .looks button:active { transform: scale(.96); }
  .looks canvas { width: 100%; max-width: 72px; aspect-ratio: 1; border-radius: 14px; background: #f4f3f0; }
  .looks button[aria-checked="true"] { background: var(--n-900); color: #fff; }
  .looks span { font-size: 12px; line-height: 1.2; text-align: center; hyphens: none; text-wrap: balance; }
  .cutbox > .panel .group.end { margin-left: auto; }
  .seg { display: inline-flex; gap: 2px; padding: 4px; height: var(--h); border-radius: var(--r-full); background: var(--fill); }
  .seg button { padding: 0 var(--s4); border-radius: var(--r-full); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
  .seg button .ic { width: 16px; height: 16px; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--n-0); color: var(--ink); }
  /* Schieber: eine runde Fläche, die sich schwarz füllt */
  .size { position: relative; width: 180px; height: var(--h); border-radius: var(--r-full); overflow: hidden; background: var(--fill); --p: 30%; }
  .size .fillbar { position: absolute; inset: 0 auto 0 0; width: max(var(--h), var(--p)); border-radius: var(--r-full); background: var(--n-900); }
  .size .fillbar::after { content: ""; position: absolute; right: 14px; top: 50%; width: 3px; height: 16px; margin-top: -8px; border-radius: 3px; background: oklch(100% 0 0 / .7); }
  .size span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 14px; pointer-events: none; }
  .size .val { right: var(--s4); color: var(--text-2); }
  .size input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }

  /* Siri-artiger Kanten-Glow, lebendiger: vier Schichten (feiner Rand, schmales Band, breites Band, weicher Hauch),
     jede ein Fenster auf einen großen Farbkreis, der sich um einen leicht versetzten Mittelpunkt dreht (dadurch
     wandern und wogen die Farben statt nur zu rotieren). Tempo und Richtung je Schicht verschieden, dazu
     zeitversetztes Atmen. Alles nur transform/opacity: läuft flüssig auf der GPU, auch während gerechnet wird. */
  .siri { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: var(--r-inner-card); opacity: 0; transition: opacity .7s var(--ease-out); }
  .siri.on { opacity: 1; }
  .siri i { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .siri i::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; will-change: transform;
    background: conic-gradient(from 0deg, #ff4a4f, #ffb199, #c8102e, #ff3d6e, #ff8a7a, #8e1427, #ff6a3d, #ff4a4f);
    background: conic-gradient(in oklch from 0deg, #ff4a4f, #ffb199, #c8102e, #ff3d6e, #ff8a7a, #8e1427, #ff6a3d, #ff4a4f);
    animation: siri-orbit var(--d, 7s) linear infinite var(--dir, normal); }
  .siri i:nth-child(2)::before { background: conic-gradient(in oklch from 120deg, #ff8a7a, #8e1427, #ff3d6e, #ffd0b8, #c8102e, #ff4a4f, #ff8a7a); }
  .siri i:nth-child(3)::before { background: conic-gradient(in oklch from 240deg, #c8102e, #ff6a3d, #ffb199, #8e1427, #ff3d6e, #c8102e); }
  .siri .band { --e: 22px; --d: 5.5s; opacity: .55; animation: siri-breathe 2.2s ease-in-out infinite; }
  .siri .wide { --e: 52px; --d: 9s; --dir: reverse; opacity: .35; animation: siri-breathe 3.1s ease-in-out infinite -.9s; }
  .siri .haze { --e: 110px; --d: 13s; opacity: .18; animation: siri-breathe 4.3s ease-in-out infinite -2s; }
  .siri .band, .siri .wide, .siri .haze { will-change: opacity;
    -webkit-mask: linear-gradient(to right, #000, transparent var(--e)), linear-gradient(to left, #000, transparent var(--e)), linear-gradient(to bottom, #000, transparent var(--e)), linear-gradient(to top, #000, transparent var(--e));
    mask: linear-gradient(to right, #000, transparent var(--e)), linear-gradient(to left, #000, transparent var(--e)), linear-gradient(to bottom, #000, transparent var(--e)), linear-gradient(to top, #000, transparent var(--e)); }
  .siri .ring { --d: 4.2s; padding: 2px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: siri-flicker 1.7s ease-in-out infinite; }
  /* Drehung um einen versetzten Punkt: die hellen Stellen laufen nicht stur im Kreis, sondern schwappen über die Kanten */
  /* Handy: jede Schicht ist eine eigene GPU-Fläche. Auf dem iPhone (Faktor 3) wären vier Flächen à 170vmax ~300 MB,
     das lässt Safari mitten in der Analyse abstürzen. Darum nur Band und Ring, und kleiner. */
  @media (pointer: coarse) { .siri .haze, .siri .wide { display: none; } .siri i::before { width: 125vmax; height: 125vmax; margin: -62.5vmax 0 0 -62.5vmax; will-change: auto; } }
  @keyframes siri-orbit { from { transform: rotate(0deg) translate(6%, -3%) rotate(0deg); } to { transform: rotate(360deg) translate(6%, -3%) rotate(-140deg); } }
  @keyframes siri-breathe { 50% { opacity: calc(var(--o, 1) * .85); } }
  @keyframes siri-flicker { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  .siri .band { --o: 1; } .siri .wide { --o: .7; } .siri .haze { --o: .4; }
  @media (prefers-reduced-motion: reduce) { .siri i::before, .siri i { animation: none !important; } }
  /* loader: the Stencit mark, a highlight running round the 8 dots (pure CSS opacity, GPU-driven) */
  .loader { position: absolute; z-index: 4; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease-out); }
  .loader.on { opacity: 1; }
  .loader i, .loader b { position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #fff; will-change: opacity; }
  .loader i { transform: rotate(calc(var(--k) * 45deg - 90deg)) translateX(14px); opacity: .22; animation: loader-dot 1.2s linear infinite; animation-delay: calc(var(--k) * .15s - 1.2s); }
  .loader b { width: 6px; height: 6px; margin: -3px; animation: siri-breathe 2.4s ease-in-out infinite; opacity: .6; }
  /* Glow nur am laufenden hellen Punkt: der Schein hängt an jedem Punkt und wird mit seiner Deckkraft schwächer */
  .loader i { box-shadow: 0 0 4px 1px oklch(100% 0 0 / .7); }
  @keyframes loader-dot { 0% { opacity: 1; } 45%, 100% { opacity: .22; } }
  .scan-dim { position: absolute; inset: 0; z-index: 2; background: oklch(0% 0 0 / .2); opacity: 0; pointer-events: none; transition: opacity .5s var(--ease-out); }
  .scan-dim.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .siri i::before, .siri .band, .loader i, .loader b { animation: none; } }


  /* ---------- Handy: die Karte füllt den Bildschirm ---------- */
  @media (max-width: 680px) {

  /* Flash-Sheet: Knopf in der Zusammenfassung, Dialog mit Papiervorschau, Druckseiten in echten Millimetern */
  .sum-print { width: 100%; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; background: oklch(100% 0 0 / .1); color: #fff; font-size: 14px; }
  .sum-print .ic { width: 18px; height: 18px; }
  .ps-prev { display: grid; justify-items: center; align-content: start; gap: 10px; height: min(42vh, 340px); overflow: auto; padding: 14px; border-radius: 20px; background: oklch(100% 0 0 / .05); scrollbar-width: none; }
  .ps-prev::-webkit-scrollbar { display: none; }
  .ps-prev .pw { position: relative; flex: none; border-radius: 4px; overflow: hidden; }
  .ps-prev .pw > .pp { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .ps-note { font-size: 12px; color: oklch(100% 0 0 / .5); text-align: center; }
  .pp { position: relative; background: #fff; color: #111; overflow: hidden; font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pp .it { position: absolute; display: grid; justify-items: center; }

  .pp .foot { position: absolute; left: 12mm; right: 12mm; bottom: 7mm; display: flex; align-items: center; justify-content: space-between; font-size: 7pt; color: #777; }
  .pp .ruler { display: flex; align-items: center; gap: 2mm; }

  #printRoot { display: none; }
  @media print {
    html, body { background: #fff !important; height: auto !important; overflow: visible !important; }

    #printRoot .pp { break-after: page; page-break-after: always; }

  }
  /* ---------- Handy quer: Rahmen nutzt den ganzen Platz, Kamera-Knöpfe als Spalte rechts (wie die iPhone-Kamera),
     links und rechts Abstand zur Kamera-Aussparung ---------- */
  @media (orientation: landscape) and (max-height: 520px) {
    .shell { grid-template-rows: 46px minmax(0, 1fr); padding: 0 max(var(--s3), env(safe-area-inset-right)) max(var(--s2), env(safe-area-inset-bottom)) max(var(--s3), env(safe-area-inset-left)); }
    .top { padding: 0; } .brand .logo { height: 16px; }
    .steps { height: 32px; } .tabbar { padding: 3px; } .tabbar button { width: 42px; height: 32px; border-radius: 16px; }
    .card { --frame-w: 5px; --r-outer: 30px; }
    #panelCam { left: auto; right: 14px; top: 50%; bottom: auto; transform: translateY(-50%); width: auto; max-width: none; padding: 0; }
    #panelCam .group { width: auto; grid-template-columns: auto; grid-template-rows: auto auto auto; gap: 16px; justify-items: center; }
    #panelCam .group > :first-child, #panelCam .group > :last-child { justify-self: center; }
    .cam-side { right: auto; left: 14px; top: 50%; bottom: auto; transform: translateY(-50%); }

  }
  /* ---------- Konto ---------- */
  .rb.acct { overflow: hidden; } .rb.acct img { width: 100%; height: 100%; object-fit: cover; }

  .acct-quota .bar { height: 8px; border-radius: 4px; background: oklch(100% 0 0 / .12); overflow: hidden; }
  .acct-quota .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--bordeaux), var(--accent)); }
  .acct-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .sheet input.acct-mail { width: 100%; height: 48px; padding: 0 18px; border: 0; border-radius: 24px; background: oklch(100% 0 0 / .08); color: #fff; font: inherit; font-size: 16px; }
  .sheet input.acct-mail::placeholder { color: oklch(100% 0 0 / .4); }

  .acct-perks li { display: flex; gap: 10px; align-items: center; } .acct-perks .ic { width: 16px; height: 16px; color: oklch(84% .2 115); }
  @media (max-width: 680px) { .rb.acct { width: 42px; height: 42px; } }
  .sheet input.acct-code { text-align: center; letter-spacing: .4em; font-size: 22px; font-variant-numeric: tabular-nums; }
  .g-btn { display: flex; justify-content: center; min-height: 44px; }
  .acct-or { display: flex; align-items: center; gap: 12px; font-size: 13px; color: oklch(100% 0 0 / .45); }
  .acct-or::before, .acct-or::after { content: ""; flex: 1; height: 1px; background: oklch(100% 0 0 / .12); }
  .steps { white-space: nowrap; hyphens: none; }
  @media (max-width: 440px) { .steps { display: none; } } /* schmale Handys: die Insel zeigt den Schritt ohnehin */

  const box = $("#printSheet"), sw = (id, t, sub) => `<button class="sw" id="${id}" role="switch"><span class="t">${t}<small>${sub}</small></span><span class="track"></span></button>`;
  box.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-label="Flash-Sheet">
    <h3>Flash-Sheet</h3>
    <div class="stack"><span class="dim">Papier</span><div class="row">${PAPERS.map(p => `<button class="opt" data-paper="${p[0]}">${p[0]}</button>`).join("")}</div>
      <div class="row"><button class="opt" data-land="0">Hochformat</button><button class="opt" data-land="1">Querformat</button></div></div>
    ${SRC.free ? `<div class="stack"><span class="dim">Größe · längste Seite</span><div class="row"><button class="opt" id="psMinus" aria-label="Kleiner">−</button>
      <span class="opt" id="psSize" style="display:grid;place-items:center;min-width:96px"></span><button class="opt" id="psPlus" aria-label="Größer">+</button></div></div>` : ""}
    <div class="stack"><span class="dim">Größen</span><div class="row">${[-2, -1, 0, 1, 2].map(d => `<button class="opt" data-step="${d}">${d ? (d > 0 ? "+" : "−") + Math.abs(d) + " cm" : "Gewählt"}</button>`).join("")}</div></div>
    ${sw("psTags", "Größe beschriften", "Tag mit Breite × Höhe unter jedem Stencil")}
    ${sw("psMirror", "Gespiegelt", "Für Thermo-Stencil und Umdruckpapier")}
    <div class="ps-prev" id="psPrev"></div><div class="ps-note" id="psNote"></div>
    <div class="stack"><button class="btn primary wide" id="psGo"><svg class="ic" aria-hidden="true"><use href="#i-printer"/></svg>Drucken oder senden</button>
      <button class="btn ghost wide" data-close>Schließen</button></div></div>`;
  let L = null;
  const update = () => {
    box.querySelectorAll("[data-paper]").forEach(b => b.setAttribute("aria-pressed", b.dataset.paper === PS.paper));
    box.querySelectorAll("[data-land]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.land === "1") === PS.land));
    box.querySelectorAll("[data-step]").forEach(b => b.setAttribute("aria-pressed", PS.steps.has(+b.dataset.step)));
    $("#psTags").setAttribute("aria-checked", PS.tags); $("#psMirror").setAttribute("aria-checked", PS.mirror);
    L = sheetPages(sheetItems()); const n = L.pages.length, prev = $("#psPrev"), top = prev.scrollTop;
    prev.innerHTML = L.pages.map(pg => `<div class="pw">${pageHTML(L, pg)}</div>`).join("") || `<span class="ps-note">Nichts zu drucken</span>`;
    const PX = 96 / 25.4, k = Math.min((prev.clientWidth - 28) / (L.W * PX), (prev.clientHeight - 28) / (L.H * PX)); // ganze Seite sichtbar
    prev.querySelectorAll(".pw").forEach(w => { w.style.width = L.W * PX * k + "px"; w.style.height = L.H * PX * k + "px"; w.firstElementChild.style.transform = `scale(${k})`; });
    prev.scrollTop = top;
    $("#psNote").textContent = `${n} Seite${n === 1 ? "" : "n"}${L.tooBig.length ? ` · ${L.tooBig.map(i => fmtCm(i.mw / 10) + " × " + fmtCm(i.mh / 10) + " cm").join(", ")} passt nicht auf ${PS.paper}${PS.land ? "" : " hoch, Querformat probieren"}` : ""} · im Druckdialog „100 %“ wählen`;
    $("#psGo").disabled = !n;
  };
  box.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { box.innerHTML = ""; });
  box.querySelectorAll("[data-paper]").forEach(b => b.onclick = () => { PS.paper = b.dataset.paper; update(); });
  box.querySelectorAll("[data-land]").forEach(b => b.onclick = () => { PS.land = b.dataset.land === "1"; update(); });
  box.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { const d = +b.dataset.step; PS.steps.has(d) ? PS.steps.size > 1 && PS.steps.delete(d) : PS.steps.add(d); update(); });
  $("#psTags").onclick = () => { PS.tags = !PS.tags; update(); };
  if (SRC.free) { // Größe für Flashes aus der Sammlung: längste Seite in halben Zentimetern
    const setLong = l => { l = clamp(Math.round(l * 2) / 2, 2, 40); SRC.w = SRC.ar >= 1 ? l : l * SRC.ar; SRC.h = SRC.ar >= 1 ? l / SRC.ar : l; $("#psSize").textContent = `${fmtCm(l)} cm`; };
    setLong(Math.max(SRC.w, SRC.h));
    $("#psMinus").onclick = () => { setLong(Math.max(SRC.w, SRC.h) - .5); update(); };
    $("#psPlus").onclick = () => { setLong(Math.max(SRC.w, SRC.h) + .5); update(); };
  }
  $("#psMirror").onclick = () => { PS.mirror = !PS.mirror; update(); };
  $("#psGo").onclick = () => {
    $("#pageSize").textContent = `@page { size: ${L.W}mm ${L.H}mm; margin: 0; }`;
    $("#printRoot").innerHTML = L.pages.map(pg => pageHTML(L, pg)).join("");
    Promise.all([...$("#printRoot").querySelectorAll("img")].map(i => i.decode?.().catch(() => {}))).then(() => window.print());
  };
  update();
}
addEventListener("afterprint", () => { $("#printRoot").innerHTML = ""; });

const GOOGLE_CLIENT_ID = "";
const loadScript = src => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res();
  document.head.append(Object.assign(document.createElement("script"), { src, async: true, onload: res, onerror: rej })); });
async function googleButton(el) {
  if (!GOOGLE_CLIENT_ID || !el) return;
  try { await loadScript("https://accounts.google.com/gsi/client"); } catch { return; }
  const raw = b64url(crypto.getRandomValues(new Uint8Array(16)));
  const hashed = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw)))].map(b => b.toString(16).padStart(2, "0")).join("");
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, nonce: hashed, ux_mode: "popup", callback: async ({ credential }) => {
    const c = await sb(); const { error } = c ? await c.auth.signInWithIdToken({ provider: "google", token: credential, nonce: raw }) : { error: new Error("offline") };
    if (error) { console.warn("google", error); status("Google-Anmeldung hat nicht geklappt", "err"); } else $("#acctSheet").innerHTML = "";
  } });

  google.accounts.id.renderButton(el, { type: "standard", theme: "filled_black", size: "large", shape: "pill", text: "continue_with", logo_alignment: "center", width: Math.min(400, el.clientWidth || 320), locale: "de" });
}

const sb = () => (sbP ||= import(SUPABASE).then(m => m.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } })).catch(e => (console.warn("supabase", e), null)));
async function acctInit() {

async function setUser(u) {
  const was = ACC.user?.id; ACC.user = u;
  if (u && u.id !== was) await refreshQuota();
  if (!u) { ACC.profile = null; ACC.freeLeft = null; ACC.tokens = 0; }

}
async function refreshQuota() { // Profil + wie viele Gratis-Motive diesen Monat noch frei sind
  const c = await sb(); if (!c || !ACC.user) return;
  const month = new Date(); month.setDate(1); const p = month.toISOString().slice(0, 10);
  const [{ data: prof }, { count }] = await Promise.all([
    c.from("profiles").select("*").eq("id", ACC.user.id).maybeSingle(),
    c.from("motif_uses").select("*", { count: "exact", head: true }).eq("period", p).eq("source", "free")]);
  ACC.profile = prof || null; ACC.tokens = prof?.tokens || 0; ACC.freeLeft = Math.max(0, FREE_MOTIFS - (count || 0));
}
const unlimited = () => ACC.profile?.plan === "unlimited" && (!ACC.profile.plan_until || new Date(ACC.profile.plan_until) > new Date());

// Motiv-Fingerabdruck: verkleinert, in 16 Grau-/Alphastufen – dasselbe Bild erneut hochgeladen ergibt denselben Wert
function motifHash(c) {
  const t = Object.assign(document.createElement("canvas"), { width: 24, height: 24 }), g = t.getContext("2d", { willReadFrequently: true });
  g.drawImage(c, 0, 0, 24, 24); const d = g.getImageData(0, 0, 24, 24).data; let h = 2166136261;
  for (let i = 0; i < d.length; i += 4) { const v = d[i + 3] < 40 ? 15 : ((d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10) >> 4; h = Math.imul(h ^ v, 16777619); }
  return (h >>> 0).toString(16) + "-" + (c.width / c.height).toFixed(2);
}
// Vor dem ersten Stechen eines Motivs: ohne Konto 1 Motiv gratis (auf dem Gerät gezählt), mit Konto bucht der Server.
const ANON_KEY = "stencit-anon-motifs";
const anonUsed = () => { try { return JSON.parse(localStorage.getItem(ANON_KEY)) || []; } catch { return []; } };
async function allowMotif() {
  const m = S.motif; if (!m || m.demo || m.allowed) return true; // das Start-Stencil (Logo) ist zum Ausprobieren frei
  const hash = (m.hash ||= motifHash(m.canvas));
  if (!ACC.user) {
    const used = anonUsed();
    if (used.includes(hash) || used.length < 1) { if (!used.includes(hash)) try { localStorage.setItem(ANON_KEY, JSON.stringify([...used, hash])); } catch {}; m.allowed = true; return true; }
    acctSheet("limit"); return false;
  }
  const c = await sb(); if (!c) { status("Konto gerade nicht erreichbar", "err"); return false; }
  const { data, error } = await c.rpc("use_motif", { hash });
  if (error) { console.warn("use_motif", error); status("Konto gerade nicht erreichbar · später nochmal", "err"); return false; }
  if (data?.ok) { m.allowed = true; if (data.free_left != null) ACC.freeLeft = data.free_left; if (data.tokens != null) ACC.tokens = data.tokens; return true; }
  if (data?.reason === "login") { acctSheet("limit"); return false; }
  acctSheet("quota"); return false;
}

// Konto-Blatt: Anmelden (E-Mail-Link) oder Übersicht
const check = '<svg class="ic" aria-hidden="true"><use href="#i-checkmark"/></svg>';
async function acctSheet(reason = "") {
  const box = $("#acctSheet"), close = () => { box.innerHTML = ""; };
  let html;
  if (!ACC.user) {
    const title = reason === "limit" ? "Kostenlos weitermachen" : "Anmelden", lead = reason === "limit"
      ? "Dein erstes Tattoo war gratis. Mit einem kostenlosen Konto geht es weiter:" : "Mit einem kostenlosen Konto bekommst du:";
    html = ACC.sentTo ? `<h3>Schau in dein Postfach</h3>
        <p class="dim" style="margin:0">Wir haben dir an <b style="font-weight:400;color:#fff">${esc(ACC.sentTo)}</b> eine Mail geschickt. Tipp darin auf den Link – oder gib hier den Code ein, falls einer drinsteht.</p>
        <input class="acct-mail acct-code" id="acctCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">
        <div class="stack"><button class="btn primary wide" id="acctVerify">Anmelden</button><button class="btn ghost wide" id="acctAgain">Andere Adresse</button></div>`
      : `<h3>${title}</h3><p class="dim" style="margin:0">${lead}</p>
        <ul class="acct-perks"><li>${check}${FREE_MOTIFS} neue Motive pro Monat anprobieren</li><li>${check}Bis zu ${FREE_STENCILS} Stencils gesichert, auf allen Geräten</li><li>${check}Flashes per Link teilen</li></ul>
        <div class="g-btn" id="gBtn" hidden></div><div class="acct-or" id="acctOr" hidden>oder mit E-Mail</div>
        <input class="acct-mail" id="acctMail" type="email" inputmode="email" autocomplete="email" placeholder="Deine E-Mail-Adresse">
        <div class="stack"><button class="btn primary wide" id="acctSend">Anmelde-Mail senden</button><button class="btn ghost wide" data-close>Später</button></div>
        <div class="sec-note"><svg class="ic" aria-hidden="true"><use href="#i-locked"/></svg><span>Kein Passwort nötig. Fotos deiner Haut bleiben immer nur auf deinem Gerät.</span></div>`;
  } else {
    await refreshQuota().catch(() => {});
    const unl = unlimited(), left = ACC.freeLeft ?? FREE_MOTIFS, saved = FL.items.filter(f => f.cloud).length;
    html = `<h3>Dein Konto</h3><p class="dim" style="margin:0">${esc(ACC.user.email || "")}</p>
      <div class="acct-quota">${unl ? `<div class="acct-row"><span>Unlimited</span><span class="dim">aktiv</span></div>`
        : `<div class="acct-row"><span>Freie Motive diesen Monat</span><span>${left} von ${FREE_MOTIFS}</span></div><div class="bar"><i style="width:${left / FREE_MOTIFS * 100}%"></i></div>`}
        <div class="acct-row"><span class="dim">Tokens</span><span>${ACC.tokens}</span></div>
        <div class="acct-row"><span class="dim">Gesicherte Stencils</span><span>${saved}${unl || ACC.tokens ? "" : ` von ${FREE_STENCILS}`}</span></div></div>
      ${reason === "quota" ? `<p style="margin:0">Deine freien Motive für diesen Monat sind aufgebraucht. Bereits angeprobierte Motive kannst du weiter frei verwenden.</p>` : ""}
      <div class="stack"><button class="btn primary wide" disabled>Tokens & Unlimited – bald</button><button class="btn ghost wide" id="acctOut">Abmelden</button><button class="btn ghost wide" data-close>Schließen</button></div>`;
  }
  const lang = getLang(); html += `<div class="stack"><span class="dim">Sprache</span><div class="row"><button class="opt" data-lang="de" aria-pressed="${lang === "de"}">Deutsch</button><button class="opt" data-lang="en" aria-pressed="${lang === "en"}">English</button></div></div>`;
  box.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-label="Konto">${html}</div>`;
  box.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { if (b.dataset.lang !== getLang()) setLang(b.dataset.lang); });
  box.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  $("#acctAgain")?.addEventListener("click", () => { ACC.sentTo = ""; acctSheet(reason); });
  $("#acctOut")?.addEventListener("click", async () => { const c = await sb(); await c?.auth.signOut(); ACC.synced = false; close(); status("Abgemeldet", "ok"); });
  googleButton($("#gBtn"));
  const code = $("#acctCode");
  if (code) { // 6-stelliger Code aus der Mail: bei 6 Ziffern automatisch prüfen
    code.focus();

      const btn = $("#acctVerify"); btn.disabled = true; btn.textContent = "Prüfe …";
      const c = await sb(); const { error } = c ? await c.auth.verifyOtp({ email: ACC.sentTo, token, type: "email" }) : { error: new Error("offline") };

}
$("#acctBtn").onclick = () => acctSheet();

// Gesicherte Stencils: Bilder privat im Speicher unter <user-id>/<stencil-id>/…, Daten in der Tabelle „stencils“.
// Die App bleibt „lokal zuerst“: alles liegt im Gerät, die Cloud ist die Sicherung und gleicht zwischen Geräten ab.
const isUuid = id => /^[0-9a-f-]{36}$/i.test(id);
async function cloudPush(f) {
  const c = await sb(); if (!c || !ACC.user || !isUuid(f.id)) return false;
  const base = `${ACC.user.id}/${f.id}/`, up = async (k, name) => { if (!f[k]) return null; const path = base + name;
    const { error } = await c.storage.from("stencils").upload(path, f[k], { upsert: true, contentType: f[k].type || "image/png" }); if (error) throw error; return path; };
  const row = { id: f.id, name: f.name || "Flash", w: f.w || null, h: f.h || null, style: f.style || null, bg: f.bg ?? null, pos: f.pos || null, motif_hash: f.hash || null, updated_at: new Date().toISOString() };
  const { data: exists } = await c.from("stencils").select("id").eq("id", f.id).maybeSingle();
  if (!exists) { const { error } = await c.from("stencils").insert({ ...row, image_path: base + "image.png" }); if (error) throw error; } // Limit prüft die Datenbank
  row.image_path = await up("blob", "image.png"); row.sticker_path = await up("sticker", "sticker.png"); row.src_path = await up("src", "src.jpg"); row.mask_path = await up("mask", "mask.png");
  const { error } = await c.from("stencils").update(row).eq("id", f.id); if (error) throw error;
  f.cloud = true; await putFlash(f); return true;
}
async function cloudDelete(id) {
  const c = await sb(); if (!c || !ACC.user || !isUuid(id)) return;
  const base = `${ACC.user.id}/${id}/`;
  await c.storage.from("stencils").remove(["image.png", "sticker.png", "src.jpg", "mask.png"].map(n => base + n)).catch(() => {});
  await c.from("stencils").delete().eq("id", id);
}
async function cloudSync() { // einmal pro Sitzung: fehlende Stencils holen, lokale (noch nicht gesicherte) hochladen
  const c = await sb(); if (!c || !ACC.user || ACC.synced) return false; ACC.synced = true;
  const { data: rows, error } = await c.from("stencils").select("*"); if (error) { console.warn("sync", error); ACC.synced = false; return false; }
  const have = new Map(FL.items.map(f => [f.id, f])); let changed = false;
  for (const r of rows) {
    const local = have.get(r.id); if (local) { if (!local.cloud) { local.cloud = true; await putFlash(local); } continue; }
    const get = async p => { if (!p) return null; const { data } = await c.storage.from("stencils").download(p); return data || null; };
    const rec = { id: r.id, name: r.name, created: Date.parse(r.created_at) || Date.now(), w: r.w, h: r.h, style: r.style, bg: r.bg, pos: r.pos, hash: r.motif_hash, cloud: true,
      blob: await get(r.image_path), sticker: await get(r.sticker_path), src: await get(r.src_path), mask: await get(r.mask_path) };
    if (rec.blob) { await putFlash(rec); changed = true; }
  }
  const ids = new Set(rows.map(r => r.id));
  for (const f of FL.items) if (isUuid(f.id) && !ids.has(f.id)) {
    try { await cloudPush(f); changed = true; } catch (e) { if (/free_limit/.test(e.message || "")) { status(`Free-Konto: ${FREE_STENCILS} Stencils gesichert, weitere bleiben auf diesem Gerät`, "ok"); break; } console.warn("push", e); }
  }
  return changed;
}
function cloudSave(f) { // nach Speichern/Bearbeiten im Hintergrund sichern
  if (!ACC.user) return;
  cloudPush(f).then(() => renderFlashes()).catch(e => status(/free_limit/.test(e.message || "") ? `Free-Konto: ${FREE_STENCILS} Stencils gesichert · dieses bleibt auf dem Gerät` : "Sichern gerade nicht möglich", /free_limit/.test(e.message || "") ? "ok" : "err"));
}
acctInit();
