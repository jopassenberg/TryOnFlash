<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stencit Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Stencit · design system
     spacing: 4 · 8 · 12 · 16 · 24 · 32 · 48     control height: 40 (on-image overlays: 32)
     radii nest: frame 28 = stage 20 + frame padding 8; controls 12; overlays 10
     type: 13 body · 12 small · 22 title; Plus Jakarta Sans 400/500, tracking -1.2 % (-5 % for brand/title)
     colour: neutral greys; red only for the primary action and live feedback */
  :root {
    --bg: #f4f3f1; --ink: #141414; --muted: #8a8886; --line: rgba(0,0,0,.08);
    --red: #e3242f; --red-2: #ff4a4f;
    --frame: #161616; --on-dark: rgba(255,255,255,.08); --on-dark-2: rgba(255,255,255,.14); --text-dim: rgba(255,255,255,.6);
    --overlay: rgba(14,14,14,.6);
    --a1: #e9e5e1; --a2: #f1dfdb; --a3: #e2dfdc; --a4: #eeebe7;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --h: 40px; --h-sm: 32px;
    --r-frame: 28px; --r-stage: 20px; --r: 12px; --r-sm: 10px;
    --track: -.05em; --track-ui: -.012em;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 13px/1.4 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; letter-spacing: var(--track-ui);
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  svg { flex: none; }

  .aura { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(80px); opacity: .6; }
  .aura i { position: absolute; border-radius: 50%; mix-blend-mode: multiply; animation: drift 18s ease-in-out infinite alternate; }
  .aura i:nth-child(1) { width: 60vmax; height: 60vmax; left: 8vmax; top: 4vmax; background: radial-gradient(circle, var(--a1) 0%, transparent 65%); }
  .aura i:nth-child(2) { width: 42vmax; height: 42vmax; right: 10vmax; top: 16vmax; background: radial-gradient(circle, var(--a2) 0%, transparent 62%); animation-duration: 22s; }
  .aura i:nth-child(3) { width: 50vmax; height: 50vmax; left: 32vmax; bottom: 2vmax; background: radial-gradient(circle, var(--a3) 0%, transparent 62%); animation-duration: 26s; }
  .aura i:nth-child(4) { width: 40vmax; height: 40vmax; left: 2vmax; bottom: 8vmax; background: radial-gradient(circle, var(--a4) 0%, transparent 62%); animation-duration: 20s; }
  @keyframes drift { from { transform: translate(-4vmax, -3vmax) scale(.95); } to { transform: translate(5vmax, 4vmax) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .aura i { animation: none; } }

  /* ---------- layout: one large photo card with a light margin, controls float on it ---------- */
  .shell { height: 100vh; height: 100dvh; padding: 0 var(--s5) var(--s5); display: grid; grid-template-rows: 64px 1fr; }
  .card { position: relative; min-height: 0; overflow: hidden; color: #fff; background: #0e0e0e; border-radius: var(--r-frame);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 24px 48px -36px rgba(0,0,0,.45); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s1); }
  .brand { display: inline-flex; align-items: center; gap: var(--s2); font-size: 18px; font-weight: 500; letter-spacing: var(--track); }
  .brand svg { width: 22px; height: 22px; }
  /* steps: one glass pill with the current step, "Platzieren · 3 / 4" */
  .steps { height: var(--h-sm); padding: 0 var(--s3); display: inline-flex; align-items: center; border-radius: var(--r-sm); font-size: 12px; background: rgba(0,0,0,.05); }
  .step { display: none; align-items: center; gap: var(--s2); }
  .step.on { display: inline-flex; }
  .step::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .step span { order: 1; }
  .step i { order: 2; font-style: normal; color: var(--muted); }
  .step i::after { content: " / 4"; }

  .stage { position: absolute; inset: 0; padding: 56px var(--s4) 88px; display: grid; place-items: center; touch-action: none; }
  .stage canvas { display: block; max-width: calc(100vw - 80px); max-height: calc(100vh - 232px); max-height: calc(100dvh - 232px); }
  #view { position: relative; border-radius: var(--r); }
  #overlay { position: absolute; pointer-events: none; }

  /* empty state */
  .drop { display: grid; justify-items: center; gap: var(--s4); padding: var(--s7) var(--s5); text-align: center; }
  .drop .mark { width: 32px; height: 32px; color: #fff; opacity: .9; }
  .drop.over { background: rgba(255,255,255,.04); }

  /* ---------- controls ---------- */
  .btn, .chip, .field, .thumb { height: var(--h); border-radius: var(--r); }
  .btn { padding: 0 var(--s4); display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); font-weight: 500; white-space: nowrap;
    transition: transform .12s ease, filter .15s ease, background .15s ease; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; }
  .btn.icon { width: var(--h); padding: 0; }
  .btn.white { background: #fff; color: var(--ink); }
  .btn.primary { background: #fff; color: var(--ink); }
  .btn.primary:hover { background: #ececea; }
  .btn.ghost { background: var(--on-dark); color: #fff; }
  .btn.ghost:hover { background: var(--on-dark-2); }
  .btn:disabled { opacity: .35; cursor: default; }
  #ai[aria-pressed="true"] { background: var(--on-dark-2); color: #fff; }
  #ai.busy svg { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .panel { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  /* dock: the step's controls float in one glass bar at the bottom of the card */
  .card > .panel { position: absolute; z-index: 5; left: 50%; bottom: var(--s4); transform: translateX(-50%); flex-wrap: nowrap; max-width: calc(100% - 32px);
    padding: var(--s2); border-radius: 20px; background: rgba(22,22,22,.62); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  .card > .panel .group + .group { padding-left: var(--s2); border-left: 1px solid rgba(255,255,255,.12); }
  .thumbs { display: flex; gap: var(--s2); }
  .thumb { width: var(--h); background: #fff; display: grid; place-items: center; overflow: hidden; transition: box-shadow .15s; }
  .thumb img { max-width: 76%; max-height: 76%; }
  .thumb[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px #fff; }
  .thumb.add { background: var(--on-dark); color: #fff; }
  .thumb.add:hover { background: var(--on-dark-2); }
  .chip { padding: 0 var(--s4); background: var(--on-dark); color: var(--text-dim); transition: background .15s, color .15s; }
  .chip:hover { color: #fff; }
  .chip[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .field { display: inline-flex; align-items: center; gap: var(--s2); padding: 0 var(--s1) 0 var(--s3); background: var(--on-dark); color: var(--text-dim); }
  .field input { width: 48px; height: var(--h-sm); border: 0; border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; text-align: center; }
  .field em { font-style: normal; padding-right: var(--s2); }


  /* on-image overlays: inset 16, height 32, radius 10 */
  .status, .views, .tagv { position: absolute; z-index: 4; border-radius: var(--r-sm); background: var(--overlay); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .status { top: var(--s4); left: 50%; transform: translateX(-50%); height: var(--h-sm); padding: 0 var(--s3); display: inline-flex; align-items: center; gap: var(--s2); font-size: 12px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .status[data-s="busy"] .dot { background: var(--red-2); animation: blink .9s infinite; }
  .status[data-s="ok"] .dot { background: var(--red-2); }
  .status[data-s="err"] .dot { background: #ffb020; }
  @keyframes blink { 50% { opacity: .25; } }
  .views { right: var(--s4); top: 50%; transform: translateY(-50%); display: grid; gap: 2px; padding: 3px; }
  .views button { height: 32px; padding: 0 var(--s3); border-radius: 7px; font-size: 12px; color: var(--text-dim); }
  .views button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .tagv { right: var(--s4); bottom: 96px; height: 24px; padding: 0 var(--s2); display: grid; place-items: center; font-size: 11px; border-radius: 8px; }

  .needle { position: absolute; z-index: 4; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--red-2); box-shadow: 0 0 0 5px rgba(255,255,255,.22); pointer-events: none; }
  .compare { position: absolute; z-index: 3; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.3); cursor: ew-resize; pointer-events: auto; }
  .compare::after { content: ""; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

  /* cutter */
  .cut { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: var(--s4); background: rgba(20,20,20,.4);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .cutbox { width: min(940px, 100%); display: grid; gap: var(--s2); padding: var(--s2); color: #fff; background: var(--frame); border-radius: var(--r-frame); }
  .cutstage .status { left: var(--s3); top: var(--s3); transform: none; }
  .cutstage { position: relative; overflow: hidden; background: #0e0e0e; border-radius: var(--r-stage); display: grid; place-items: center; min-height: 280px; }
  #cutCanvas { display: block; max-width: 100%; max-height: 70vh; touch-action: none; cursor: crosshair; }
  .cutstage .status { pointer-events: none; }

  @supports (corner-shape: squircle) {
    .card, .cutbox, .cutstage, .btn, .chip, .field, .thumb, .status, .views, .tagv { corner-shape: squircle; }
    .siri, .siri i, .siri i::before { corner-shape: squircle; }
    .card, .cutbox { border-radius: calc(var(--r-frame) * 1.6); } .cutstage { border-radius: calc(var(--r-stage) * 1.6); }
    .btn, .chip, .field, .thumb { border-radius: calc(var(--r) * 1.6); } .status, .views { border-radius: calc(var(--r-sm) * 1.6); }
  }

  /* Siri-style edge glow (after the open-source SwiftUI recreation "AppleIntelligenceGlowEffect"):
     four rings of the same angular gradient, 6/9/11/15 px wide, blurred 0/4/12/15 px. The gradient's
     stops jump to random positions every 0.5 s and glide there over 1 s. Red palette instead of Siri's. */
  @property --c0 { syntax: "<color>"; inherits: true; initial-value: #ff4a4f; }
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #ff8a7a; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #c8102e; }
  @property --c3 { syntax: "<color>"; inherits: true; initial-value: #ff3d6e; }
  @property --c4 { syntax: "<color>"; inherits: true; initial-value: #ffb199; }
  @property --c5 { syntax: "<color>"; inherits: true; initial-value: #8e1427; }
  @property --p0 { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
  @property --p1 { syntax: "<percentage>"; inherits: true; initial-value: 20%; }
  @property --p2 { syntax: "<percentage>"; inherits: true; initial-value: 40%; }
  @property --p3 { syntax: "<percentage>"; inherits: true; initial-value: 60%; }
  @property --p4 { syntax: "<percentage>"; inherits: true; initial-value: 80%; }
  @property --p5 { syntax: "<percentage>"; inherits: true; initial-value: 100%; }
  .siri { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit; opacity: 0;
    transition: opacity .6s ease, --c0 1s ease-in-out, --c1 1s ease-in-out, --c2 1s ease-in-out, --c3 1s ease-in-out, --c4 1s ease-in-out, --c5 1s ease-in-out,
      --p0 1s ease-in-out, --p1 1s ease-in-out, --p2 1s ease-in-out, --p3 1s ease-in-out, --p4 1s ease-in-out, --p5 1s ease-in-out; }
  .siri.on { opacity: 1; }
  .siri i { position: absolute; inset: 0; border-radius: inherit; filter: blur(var(--b)); }
  .siri i::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--w);
    background: conic-gradient(from 0deg, var(--c0) var(--p0), var(--c1) var(--p1), var(--c2) var(--p2), var(--c3) var(--p3), var(--c4) var(--p4), var(--c5) var(--p5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .siri i:nth-child(1) { --w: 6px; --b: 0px; }
  .siri i:nth-child(2) { --w: 9px; --b: 4px; }
  .siri i:nth-child(3) { --w: 11px; --b: 12px; }
  .siri i:nth-child(4) { --w: 15px; --b: 15px; }
  @media (prefers-reduced-motion: reduce) { .siri { transition: opacity .6s ease; } }

  /* ---------- phones: the card becomes the whole screen ---------- */
  @media (max-width: 680px) {
    .shell { padding: 0 var(--s2) var(--s2); grid-template-rows: 56px 1fr; }
    .top { padding: 0 var(--s2); }
    .card { border-radius: 24px; }
    @supports (corner-shape: squircle) { .card { border-radius: 38px; } }
    .status { top: var(--s3); }
    .stage { padding: 56px 0 136px; }
    .stage canvas { max-width: calc(100vw - 16px); max-height: calc(100vh - 264px); max-height: calc(100dvh - 264px); }
    #view { border-radius: 0; }
    .views { right: var(--s3); }
    .tagv { right: var(--s3); bottom: 148px; }
    .card > .panel { left: var(--s3); right: var(--s3); bottom: var(--s3); transform: none; max-width: none; flex-wrap: wrap; border-radius: 24px; }
    .card > .panel .group { width: 100%; }
    .card > .panel .group + .group { padding-left: 0; border-left: 0; }
    .card > .panel .group.end > .btn:not(.icon) { flex: 1; }
    .cut { padding: var(--s2); }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="shell">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="16" cy="16" r="3.4"/><circle cx="26.00" cy="16.00" r="2.6"/><circle cx="23.07" cy="23.07" r="2.6"/><circle cx="16.00" cy="26.00" r="2.6"/><circle cx="8.93" cy="23.07" r="2.6"/><circle cx="6.00" cy="16.00" r="2.6"/><circle cx="8.93" cy="8.93" r="2.6"/><circle cx="16.00" cy="6.00" r="2.6"/><circle cx="23.07" cy="8.93" r="2.6"/></g></svg>Stencit</div>
    <nav class="steps" aria-label="Schritte">
      <div class="step" data-step="1"><i>1</i><span>Foto</span></div>
      <div class="step" data-step="2"><i>2</i><span>Analyse</span></div>
      <div class="step" data-step="3"><i>3</i><span>Platzieren</span></div>
      <div class="step" data-step="4"><i>4</i><span>Stechen</span></div>
    </nav>
  </header>
  <main class="card">
    <div class="siri" id="siri" hidden><i></i><i></i><i></i><i></i></div>
    <div class="stage" id="stage">
      <div class="drop" id="drop">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="mark"><g fill="currentColor"><circle cx="16" cy="16" r="3.4"/><circle cx="26.00" cy="16.00" r="2.6"/><circle cx="23.07" cy="23.07" r="2.6"/><circle cx="16.00" cy="26.00" r="2.6"/><circle cx="8.93" cy="23.07" r="2.6"/><circle cx="6.00" cy="16.00" r="2.6"/><circle cx="8.93" cy="8.93" r="2.6"/><circle cx="16.00" cy="6.00" r="2.6"/><circle cx="23.07" cy="8.93" r="2.6"/></g></svg>
        <button class="btn white" id="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Foto wählen</button>
      </div>
      <div id="viewWrap" hidden style="position:relative">
        <canvas id="view"></canvas>
        <canvas id="overlay"></canvas>
        <div class="compare" id="compare" hidden></div>
        <div class="needle" id="needle" hidden></div>
      </div>
      <div class="status" id="status" hidden data-s="idle"><span class="dot"></span><span id="statusText"></span></div>
      <div class="views" id="views" hidden>
        <button data-view="photo" aria-pressed="true">Foto</button>
        <button data-view="depth" aria-pressed="false">Tiefe</button>
        <button data-view="mesh" aria-pressed="false">3D</button>
      </div>
      <div class="tagv" id="tagSize" hidden></div>
    </div>

    <div class="panel" id="panelPlace" hidden>
      <div class="group">
        <div class="thumbs" id="thumbs"><button class="thumb add" id="addMotif" title="Motiv hinzufügen" aria-label="Motiv hinzufügen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <label class="field" title="Breite des Arms an der Stelle">Armbreite <input id="armCm" type="number" min="4" max="20" step="0.5" value="7.5"><em>cm</em></label>
      </div>
      <div class="group end">
        <button class="btn ghost icon" id="newPhoto" title="Neues Foto" aria-label="Neues Foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
        <button class="btn primary" id="ink" disabled>Stechen</button>
      </div>
    </div>

    <div class="panel" id="panelDone" hidden>
      <div class="group">
        <button class="chip" id="cmp" aria-pressed="false">Vergleich</button>
      </div>
      <div class="group end">
        <button class="btn ghost icon" id="edit" title="Zurück zum Platzieren" aria-label="Zurück zum Platzieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="btn ghost icon" id="save" title="Bild speichern" aria-label="Bild speichern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
        <button class="btn primary" id="ai" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>KI-Finish</button>
      </div>
    </div>
  </main>

  <div class="cut" id="cut" hidden>
    <div class="cutbox">
      <div class="cutstage">
        <canvas id="cutCanvas"></canvas>
        <div class="status" data-s="ok"><span class="dot"></span><span id="cutHint">Tattoo umfahren</span></div>
      </div>
      <div class="panel">
        <div class="group">
          <button class="chip" id="cutBg" aria-pressed="true">Hintergrund entfernen</button>
          <button class="chip" id="cutAll">Ganzes Bild</button>
        </div>
        <div class="group end">
          <button class="btn ghost" id="cutCancel">Abbrechen</button>
          <button class="btn primary" id="cutOk">Übernehmen</button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden>
  <input type="file" id="motifInput" accept="image/*" hidden>
</div>

<script type="module">
// Flash Studio: photo -> depth + skin analysis -> surface-true placement -> "stechen" render.
// Everything runs in the browser; the photo never leaves the device.
const TRANSFORMERS = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/dist/transformers.min.js";
const DEPTH_MODEL = "onnx-community/depth-anything-v2-small";
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs";
const VISION_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/wasm";
const SEG_MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const SKIN_CLASS = 2;
// render = output image, proc = segmenter input, geo = depth input and resolution of the 3D surface
const RENDER_MAX = 1600, PROC_MAX = 640, GEO_MAX = 1024, PREVIEW_MAX = 900;
// Depth model input side: the GPU gets ~1.6x the model's default 518 px for finer relief
const DEPTH_SIDE = { webgpu: 812, wasm: 518 };

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const view = $("#view"), vctx = view.getContext("2d", { willReadFrequently: true });
const overlay = $("#overlay"), octx = overlay.getContext("2d");

const S = {
  step: 1, photo: null, proc: null, geo: null, // render-res, segmenter-res and geometry-res canvases
  disp: null, dispN: null, skin: null, height: null, relief: null, lum: null, nrm: null, nrmF: null, pw: 0, ph: 0, // geo-res maps
  light: [-.35, -.55, .76], mesh: null, ink: null, age: .4,

      if (p < 1) requestAnimationFrame(step); else { nd.hidden = true; resolve(); }
    };
    requestAnimationFrame(step);
  });
}
$("#ink").onclick = stechen;
$("#edit").onclick = () => { S.inked = S.local = S.ai = S.ink = null; S.comparing = false; $("#compare").hidden = true; setStep(3); status(""); redraw(); };
$("#cmp").onclick = () => {
  S.comparing = !S.comparing; $("#cmp").setAttribute("aria-pressed", S.comparing); $("#compare").hidden = !S.comparing; placeCompare(); redraw();
};
function placeCompare() { const c = $("#compare"); c.style.left = (view.offsetLeft + S.compare * view.clientWidth) + "px"; c.style.top = view.offsetTop + "px"; c.style.height = view.clientHeight + "px"; }
$("#compare").addEventListener("pointerdown", e => {
  const c = $("#compare"); c.setPointerCapture(e.pointerId);
  const mv = ev => { const b = view.getBoundingClientRect(); S.compare = clamp((ev.clientX - b.left) / b.width, 0, 1); placeCompare(); redraw(); };
  const up = () => { c.removeEventListener("pointermove", mv); c.removeEventListener("pointerup", up); };
  c.addEventListener("pointermove", mv); c.addEventListener("pointerup", up);
});
$("#save").onclick = () => S.inked?.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "tattoo-vorschau.png"; a.click(); }, "image/png");

window.__studio = { S, loadPhoto, loadMotif, openCut, extract, addMotif, stechen, warp, depthMask, buildGeometry, redraw, setStep, CUT, scanStart, scanFinish };
